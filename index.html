  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&#8226;?|&bull;|\u2022/g, '|')
      .replace(/&#8212;?|&mdash;|\u2014/g, '-')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

      month: 'short',
      year: 'numeric'
    }).format(now);
    const jam = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }).format(now).replace(/\./g, ':');
    return `${tgl} | ${jam} WITA`;
  }

  function formatDateTimeWita(isoStr) {
    if (!isoStr) return '-';
    const d = new Date(isoStr);
    if (Number.isNaN(d.getTime())) return '-';
    const tgl = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    }).format(d);
    const jam = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).format(d).replace(/\./g, ':');
    return `${tgl}, ${jam} WITA`;
  }

  function toDatetimeLocalWita(isoStr) {
    const d = isoStr ? new Date(isoStr) : new Date();
    if (Number.isNaN(d.getTime())) return '';
    const witaMs = d.getTime() + 8 * 3600 * 1000;
    const witaDate = new Date(witaMs);
    return witaDate.toISOString().slice(0, 16);
  }

  function parseWitaDatetimeLocal(localVal) {
    if (!localVal) return new Date().toISOString();
    const normalized = localVal.length === 16 ? `${localVal}:00+08:00` : `${localVal}+08:00`;
    const parsed = new Date(normalized);
    return Number.isNaN(parsed.getTime()) ? new Date().toISOString() : parsed.toISOString();
  }

  function formatRemainingTime(sec) {
    const s = Math.max(0, Math.floor(Number(sec) || 0));
    const hrs = Math.floor(s / 3600);
    const mins = Math.floor((s % 3600) / 60);
    const secs = s % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
  }

  function isJadwalExpired(jadwal) {
    if (!jadwal || !jadwal.waktu_selesai) return false;
    return Date.now() > new Date(jadwal.waktu_selesai).getTime();
  }

  function getEffectiveJadwalStatus(jadwal) {
    if (!jadwal) return 'Nonaktif';
    if (jadwal.status === 'Selesai' || isJadwalExpired(jadwal)) return 'Selesai';
    return jadwal.status || 'Aktif';
  }

  function parseKelasString(str) {
    if (!str) return [];
    return String(str)
      .split(',')
      .map(s => s.trim())
      .filter(Boolean);
  }

  function normalizeTipeSoal(raw) {
    const t = String(raw || 'PILIHAN GANDA').trim().toUpperCase();
    if (t === 'PILIHAN GANDA KOMPLEK') return 'PILIHAN GANDA KOMPLEKS';
    return t;
  }

  function normalizePasanganJson(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) {
      return raw.map(item => ({
        kiri: String(item?.kiri || '').trim(),
        kanan: String(item?.kanan || '').trim()
      }));
    }
    if (typeof raw === 'string') {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return normalizePasanganJson(parsed);
      } catch (e) {}
    }
    return [];
  }

  function normalizePgkAnswerArray(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) return [...new Set(raw.map(v => String(v).trim().toUpperCase()).filter(Boolean))];
    if (typeof raw === 'string') {
      return [...new Set(raw.split(',').map(v => v.trim().toUpperCase()).filter(Boolean))];
    }
    return [];
  }

  function normalizeMatchAnswerObj(raw) {
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) return { ...raw };
    return {};
  }

  function isSoalAnswered(soal, val) {
    if (!soal || val === undefined || val === null) return false;
    const tipe = normalizeTipeSoal(soal.tipe_soal);
    if (tipe === 'MENJODOHKAN') {
      const pairs = normalizePasanganJson(soal.pasangan_json);
      if (typeof val !== 'object' || Array.isArray(val)) return false;
      const filled = Object.values(val).filter(v => String(v || '').trim() !== '').length;
      return pairs.length > 0 ? filled >= pairs.length : filled > 0;
    }
    if (tipe === 'PILIHAN GANDA KOMPLEKS' || Array.isArray(val)) {
      return normalizePgkAnswerArray(val).length > 0;
    }
    return String(val).trim() !== '';
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {

  function compressImageToDataUrl(file, maxDim = 320, quality = 0.82) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          let dataUrl = '';
          try {
            dataUrl = canvas.toDataURL('image/webp', quality);
          } catch (err) {}
          if (!dataUrl || !dataUrl.startsWith('data:image/webp')) {
            dataUrl = canvas.toDataURL('image/png');
          }
          resolve(dataUrl);
        };
        img.onerror = () => resolve(ev.target.result);
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function setAntiTranslate(lock) {
    try {
      const htmlEl = document.documentElement;
      if (lock) {
        htmlEl.setAttribute('translate', 'no');

  let sharedAudioCtx = null;
  function unlockAudioContext() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!sharedAudioCtx) sharedAudioCtx = new AudioCtx();
      if (sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume().catch(() => {});
      }
    } catch (e) {}
  }

  function playViolationSound() {
    try {
      unlockAudioContext();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = sharedAudioCtx || new AudioCtx();
      const now = ctx.currentTime;
      const freqs = [880, 620, 960, 620, 1040];
      freqs.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, now + idx * 0.14);
        gain.gain.setValueAtTime(0.24, now + idx * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.13);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.14);
        osc.stop(now + idx * 0.14 + 0.135);
      });
    } catch (e) {}
  }

  async function saveSchoolConfigRecord(payload) {
    if (IS_PREVIEW || !supabase) {
      let saved;
      if (state.db.pengaturan_sekolah.length > 0) {
        saved = await dbUpdate('pengaturan_sekolah', state.db.pengaturan_sekolah[0].id, payload);
      } else {
        saved = await dbInsert('pengaturan_sekolah', payload);
      }
      saveSchoolConfigCache(saved || payload);
      return saved;
    }

    const { data: existingRows, error: fetchErr } = await supabase
      .from('pengaturan_sekolah')
      .select('id')
      .limit(1);
    if (fetchErr) throw fetchErr;

    let savedRow;
    if (existingRows && existingRows.length > 0) {
      const targetId = existingRows[0].id;
      const { data, error } = await supabase
        .from('pengaturan_sekolah')
        .update(payload)
        .eq('id', targetId)
        .select()
        .single();

        .from('pengaturan_sekolah')
        .insert([payload])
        .select()
        .single();
      if (error) throw error;
      savedRow = data;

  function applyRealtimeRowChange(table, eventType, newRow, oldRow) {
    if (!state.db[table]) return;
    if (eventType === 'INSERT' && newRow) {
      const exists = state.db[table].some(item => item.id === newRow.id);
      if (!exists) state.db[table].push(newRow);
      else state.db[table] = state.db[table].map(item => item.id === newRow.id ? newRow : item);
    } else if (eventType === 'UPDATE' && newRow) {
      const idx = state.db[table].findIndex(item => item.id === newRow.id);
      if (idx !== -1) state.db[table][idx] = newRow;
      else state.db[table].push(newRow);
    } else if (eventType === 'DELETE' && oldRow) {
      state.db[table] = state.db[table].filter(item => item.id !== oldRow.id);
    }

    if (state.exam.active && state.exam.sesiRecord && table === 'sesi_ujian_siswa') {
      const updatedSesi = state.db.sesi_ujian_siswa.find(s => s.id === state.exam.sesiRecord.id);
      if (updatedSesi) {
        handleRemoteSessionUnlocked(updatedSesi);
        return;
      }
    }

    if (state.exam.active && state.exam.jadwal && table === 'jadwal_ujian' && newRow?.id === state.exam.jadwal.id) {
      state.exam.jadwal = { ...state.exam.jadwal, ...newRow };
    }

    if (!state.exam.active && !isUserInteractingWithForm()) {
      render();
    }
  }

  function setupRealtimeSync() {
    if (syncChannel) {
      syncChannel.onmessage = () => {
        if (!IS_PREVIEW && supabase) {
          syncFastOperationalData(true);
        }
      };
    }

    if (IS_PREVIEW || !supabase) return;
    try {
      const tablesToWatch = ['jadwal_ujian', 'sesi_ujian_siswa', 'users_cbt', 'mata_pelajaran', 'pengaturan_sekolah', 'bank_soal'];
      const channel = supabase.channel('cbt-promax-realtime-fast');
      tablesToWatch.forEach(tbl => {
        channel.on('postgres_changes', { event: '*', schema: 'public', table: tbl }, (payload) => {
          applyRealtimeRowChange(tbl, payload.eventType, payload.new, payload.old);
        });
      });
      channel.subscribe();
    } catch (e) {}
  }

  async function syncFastOperationalData(forceRender = false) {
    if (IS_PREVIEW || !supabase || isFastSyncing) return;
    isFastSyncing = true;
    try {
      const [cfgRes, usersRes, mapelRes, soalRes, jadwalRes, sesiRes] = await Promise.all([
        supabase.from('pengaturan_sekolah').select('*').limit(1),
        supabase.from('users_cbt').select('*').order('nama_lengkap', { ascending: true }),
        supabase.from('mata_pelajaran').select('*').order('nama_mapel', { ascending: true }),
        supabase.from('bank_soal').select('*').order('nomor_urut', { ascending: true }),
        supabase.from('jadwal_ujian').select('*').order('created_at', { ascending: false }),
        supabase.from('sesi_ujian_siswa').select('*').order('waktu_mulai', { ascending: false })
      ]);

      if (!cfgRes.error && cfgRes.data) {
        state.db.pengaturan_sekolah = cfgRes.data;
        if (cfgRes.data[0]) saveSchoolConfigCache(cfgRes.data[0]);
      }
      if (!usersRes.error && usersRes.data) state.db.users_cbt = usersRes.data;
      if (!mapelRes.error && mapelRes.data) state.db.mata_pelajaran = mapelRes.data;
      if (!soalRes.error && soalRes.data) state.db.bank_soal = soalRes.data;
      if (!jadwalRes.error && jadwalRes.data) state.db.jadwal_ujian = jadwalRes.data;
      if (!sesiRes.error && sesiRes.data) state.db.sesi_ujian_siswa = sesiRes.data;

      if (state.exam.active && state.exam.locked && state.exam.sesiRecord) {
        const latestSesi = state.db.sesi_ujian_siswa.find(s => s.id === state.exam.sesiRecord.id);
        if (latestSesi && latestSesi.status !== 'terkunci') {
          handleRemoteSessionUnlocked(latestSesi);
          return;
        }
      }

      const nextHash = JSON.stringify({
        j: state.db.jadwal_ujian.map(x => [x.id, x.status, x.waktu_mulai, x.waktu_selesai, x.token_ujian, x.acak_soal, x.acak_opsi]),
        s: state.db.sesi_ujian_siswa.map(x => [x.id, x.status, x.jumlah_pelanggaran, x.skor_pg, x.skor_essay, x.nilai_akhir, Object.keys(x.jawaban_json || {}).length]),
        u: state.db.users_cbt.map(x => [x.id, x.is_logged_in, x.kelas])
      });

      if ((forceRender || nextHash !== lastFastSyncHash) && !state.exam.active && !isUserInteractingWithForm()) {
        lastFastSyncHash = nextHash;
        render();
      } else {
        lastFastSyncHash = nextHash;
      }
    } catch (e) {
    } finally {
      isFastSyncing = false;
    }
  }

  async function dbInsert(table, payload) {
    if (IS_PREVIEW || !supabase) {
      const row = { id: generateLocalId(table.slice(0, 3)), created_at: new Date().toISOString(), ...payload };
      state.db[table].push(row);
      return row;
    }
    const { data, error } = await supabase.from(table).insert([payload]).select().single();
    if (error) throw error;
    state.db[table].push(data);
    broadcastLocalSync(table);
    return data;
  }

  async function dbUpdate(table, id, payload) {
    if (IS_PREVIEW || !supabase) {
      const idx = state.db[table].findIndex(item => item.id === id);
      if (idx !== -1) {
        state.db[table][idx] = { ...state.db[table][idx], ...payload };
        return state.db[table][idx];
      }
      return null;
    }
    const { data, error } = await supabase.from(table).update(payload).eq('id', id).select().single();
    if (error) throw error;
    const idx = state.db[table].findIndex(item => item.id === id);
    if (idx !== -1) state.db[table][idx] = data;
    broadcastLocalSync(table);
    return data;
  }

  async function dbDeleteMany(table, ids) {
    if (!Array.isArray(ids) || ids.length === 0) return;
    const idSet = new Set(ids);
    if (IS_PREVIEW || !supabase) {
      state.db[table] = state.db[table].filter(item => !idSet.has(item.id));
      if (table === 'mata_pelajaran') {
        state.db.bank_soal = state.db.bank_soal.filter(s => !idSet.has(s.mapel_id));
        state.db.jadwal_ujian = state.db.jadwal_ujian.filter(j => !idSet.has(j.mapel_id));
      } else if (table === 'jadwal_ujian') {
        state.db.sesi_ujian_siswa = state.db.sesi_ujian_siswa.filter(s => !idSet.has(s.jadwal_id));
      }
      return;
    }
    const { error } = await supabase.from(table).delete().in('id', ids);
    if (error) throw error;
    state.db[table] = state.db[table].filter(item => !idSet.has(item.id));
    broadcastLocalSync(table);
  }

    try {
      if (!IS_PREVIEW && !isSupabaseConfigured) {
        throw new Error('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi dengan benar.');
      }

      if (username.toLowerCase() === 'admin') {
        if (IS_PREVIEW || !supabase) {
          if (password === 'admincbt') {
            state.currentUser = {
              id: 'admin-root',
              username: 'admin',
              nama_lengkap: 'Administrator CBT Promax',
              role: 'admin',
              kelas: '-',
              agama: 'Islam',
              nomor_peserta: '-'
            };
            state.activeMenu = 'dashboard';
            showToast('Selamat datang, Administrator!');
          } else {
            showToast('Password Administrator salah!', 'error');
          }
          state.loading = false;
          render();
          return;
        } else {
          const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
            email: ADMIN_AUTH_EMAIL,
            password
          });
          if (authErr || !authData?.user) {
            showToast('Login Admin gagal! Pastikan akun admin@cbtpromax.sch.id terdaftar di Supabase Auth.', 'error');
            state.loading = false;
            render();
            return;
          }
          state.currentUser = {
            id: authData.user.id,
            username: 'admin',
            nama_lengkap: 'Administrator CBT Promax',
            role: 'admin',
            kelas: '-',
            agama: 'Islam',
            nomor_peserta: '-'
          };
          await loadAllData();
          state.activeMenu = 'dashboard';
          showToast('Berhasil masuk sebagai Administrator!');
          state.loading = false;
          render();
          return;
        }
      }

      let foundUser = null;
      if (IS_PREVIEW || !supabase) {
        foundUser = state.db.users_cbt.find(u => u.username === username && u.password === password);
      } else {
        const { data, error } = await supabase
          .from('users_cbt')
          .select('*')
          .eq('username', username)
          .eq('password', password)
          .limit(1)
          .maybeSingle();
        if (error) throw error;
        foundUser = data;
      }

      if (!foundUser) {
        showToast('Username atau Password tidak ditemukan!', 'error');
        state.loading = false;
        render();
        return;
      }

      if (foundUser.role === 'siswa' && foundUser.is_logged_in) {
        showToast('Akun sedang aktif di perangkat lain! Hubungi Proktor/Pengawas untuk Reset Login.', 'error');
        state.loading = false;
        render();
        return;
      }

      if (foundUser.role === 'siswa') {
        await dbUpdate('users_cbt', foundUser.id, { is_logged_in: true });
        foundUser.is_logged_in = true;
      }

      if (!IS_PREVIEW && supabase) {
        await loadAllData();
      }

      state.currentUser = foundUser;
      state.activeMenu = foundUser.role === 'siswa' ? 'dashboard_siswa' : 'dashboard';
      showToast(`Selamat datang, ${foundUser.nama_lengkap}!`);
    } catch (err) {
      showToast('Terjadi kesalahan saat masuk: ' + (err.message || err), 'error');
    } finally {
      state.loading = false;
      render();
    }
  }

  async function handleLogout() {
    cleanupExamEnvironment();
    if (state.currentUser) {
      if (state.currentUser.role === 'siswa') {
        try {
          await dbUpdate('users_cbt', state.currentUser.id, { is_logged_in: false });
        } catch (e) {}
      } else if (state.currentUser.role === 'admin' && !IS_PREVIEW && supabase) {
        try { await supabase.auth.signOut(); } catch (e) {}
      }
    }
    state.currentUser = null;
    state.activeMenu = 'dashboard';
    render();
  }

  // =========================================================================
  // KEAMANAN ANTI-CURANG (ANTI-AI, ANTI-FLOATING, ANTI-EMULATOR, ANTI-SWIPE)
  // =========================================================================
  function detectVirtualAndroidOrEmulator() {
    try {
      const ua = (navigator.userAgent || '').toLowerCase();
      // Izinkan Chromebook asli (ChromeOS menggunakan CrOS dan sering memakai arsitektur x86_64)
      const isChromebook = ua.includes('cros');
      if (navigator.webdriver) return 'Browser Otomatis / WebDriver terdeteksi';

      const emuSignatures = [
        'bluestacks', 'nox', 'ldplayer', 'memu', 'genymotion', 'andy',
        'droid4x', 'koplayer', 'remixos', 'phoenixos', 'vmos',
        'parallel space', 'dual space', 'virtualxposed'
      ];
      for (const sig of emuSignatures) {
        if (ua.includes(sig)) return `Lingkungan Virtual / Emulator (${sig}) terdeteksi`;
      }

      if (!isChromebook && ua.includes('android') && (ua.includes('x86_64') || ua.includes('i686'))) {
        return 'Emulator Android (x86) terdeteksi';
      }

      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (gl) {
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        if (dbg) {
          const renderer = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
          if (renderer.includes('bluestacks') || renderer.includes('virtualbox') || renderer.includes('vmware')) {
            return `Renderer Virtual (${renderer}) terdeteksi`;
          }
          if (!isChromebook && ua.includes('android') && (renderer.includes('swiftshader') || renderer.includes('llvmpipe'))) {
            return `Renderer Virtual Android (${renderer}) terdeteksi`;
          }
        }
      }
    } catch (e) {}
    return null;
  }

  function safeRequestFullscreen() {
    try {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    } catch (e) {}
  }

  function safeExitFullscreen() {
    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    } catch (e) {}
  }

  async function recordExamViolation(reason) {
    if (!state.exam.active || state.exam.isSubmitting || state.exam.finishedHandled) return;
    const now = Date.now();
    if (now < state.exam.graceUntil) return;
    if (now - state.exam.lastViolationAt < 2500) return;
    state.exam.lastViolationAt = now;

    playViolationSound();

    const cfg = getSchoolConfig();
    const maxPelanggaran = Math.max(1, Number(cfg.max_pelanggaran) || 3);
    const sesi = state.exam.sesiRecord;
    let count = 1;
    let isLocked = false;

    if (sesi) {
      count = (Number(sesi.jumlah_pelanggaran) || 0) + 1;
      isLocked = count >= maxPelanggaran;
      const logs = Array.isArray(sesi.log_pelanggaran) ? [...sesi.log_pelanggaran] : [];
      logs.push({ waktu: new Date().toISOString(), alasan: reason });
      const newStatus = isLocked ? 'terkunci' : 'mengerjakan';

      sesi.jumlah_pelanggaran = count;
      sesi.log_pelanggaran = logs;
      sesi.status = newStatus;

      try {
        await dbUpdate('sesi_ujian_siswa', sesi.id, {
          jumlah_pelanggaran: count,
          log_pelanggaran: logs,
          status: newStatus
        });
      } catch (e) {}
    }

    if (isLocked) {
      state.exam.locked = true;
    }

    const curtain = document.getElementById('security-curtain');
    const cTitle = document.getElementById('curtain-title');
    const cReason = document.getElementById('curtain-reason');
    const cCounter = document.getElementById('curtain-counter');
    const btnDismiss = document.getElementById('btn-dismiss-curtain');
    const btnCheckUnlock = document.getElementById('btn-check-unlock');

    if (curtain) {
      curtain.style.display = 'flex';
      if (cTitle) {
        cTitle.textContent = isLocked ? 'UJIAN TERKUNCI OTOMATIS' : 'PELANGGARAN KEAMANAN TERDETEKSI';
      }
      if (cReason) {
        cReason.textContent = isLocked
          ? `Anda telah mencapai batas maksimal pelanggaran (${count}/${maxPelanggaran}x) karena: ${reason}. Hubungi Pengawas/Proktor untuk membuka kunci ujian.`
          : `Terdeteksi: ${reason}. Pelanggaran dicatat ke server pengawas.`;
      }
      if (cCounter) {
        cCounter.textContent = `Pelanggaran ke-${count} dari maksimal ${maxPelanggaran}`;
      }
      if (btnDismiss) {
        btnDismiss.classList.toggle('hidden', isLocked);
      }
      if (btnCheckUnlock) {
        btnCheckUnlock.classList.toggle('hidden', !isLocked);
      }
    }
  }

  function handleExamVisibilityChange() {
    if (!state.exam.active || state.exam.locked) return;
    if (document.hidden) {
      recordExamViolation('Berpindah tab atau meminimalkan aplikasi ujian');
    }
  }

  function handleExamWindowBlur() {
    if (!state.exam.active || state.exam.locked) return;
    recordExamViolation('Fokus layar keluar dari jendela ujian (Split Screen / Floating App)');
  }

  function handleExamKeydown(e) {
    if (!state.exam.active) return;
    const key = (e.key || '').toLowerCase();
    if (
      key === 'printscreen' ||
      key === 'f12' ||
      (e.ctrlKey && ['c', 'v', 'x', 'p', 's', 'u', 'i', 'j'].includes(key)) ||
      (e.metaKey && e.shiftKey && ['3', '4', '5'].includes(key))
    ) {
      e.preventDefault();
      recordExamViolation('Menekan tombol pintasan terlarang / Screenshot');
    }
  }

  function handleExamTouchStart(e) {
    if (!state.exam.active) return;
    if (e.touches && e.touches.length >= 3) {
      recordExamViolation('Sentuhan 3 jari (Gesture Screenshot) terdeteksi');
    }
  }

  function handleExamContextMenu(e) {
    if (!state.exam.active) return;
    const tag = (e.target?.tagName || '').toUpperCase();
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault();
    }
  }

  function setupExamSecurityListeners() {
    document.documentElement.classList.add('exam-active-lock');
    document.body.classList.add('exam-active-lock');
    const rootEl = document.getElementById('cbt-promax-root');
    if (rootEl) rootEl.classList.add('exam-active-lock');

    document.addEventListener('visibilitychange', handleExamVisibilityChange);
    window.addEventListener('blur', handleExamWindowBlur);
    document.addEventListener('keydown', handleExamKeydown, true);
    document.addEventListener('touchstart', handleExamTouchStart, { passive: true });
    document.addEventListener('contextmenu', handleExamContextMenu);
  }

  function cleanupExamEnvironment() {
    state.exam.active = false;
    state.exam.locked = false;
    if (state.exam.timerInterval) {
      clearInterval(state.exam.timerInterval);
      state.exam.timerInterval = null;
    }
    if (state.exam.watchdogInterval) {
      clearInterval(state.exam.watchdogInterval);
      state.exam.watchdogInterval = null;
    }
    document.documentElement.classList.remove('exam-active-lock');
    document.body.classList.remove('exam-active-lock');
    const rootEl = document.getElementById('cbt-promax-root');
    if (rootEl) rootEl.classList.remove('exam-active-lock');

    document.removeEventListener('visibilitychange', handleExamVisibilityChange);
    window.removeEventListener('blur', handleExamWindowBlur);
    document.removeEventListener('keydown', handleExamKeydown, true);
    document.removeEventListener('touchstart', handleExamTouchStart);
    document.removeEventListener('contextmenu', handleExamContextMenu);

    const curtain = document.getElementById('security-curtain');
    if (curtain) curtain.style.display = 'none';
    setAntiTranslate(false);
    safeExitFullscreen();
  }

  // =========================================================================
  // LOGIKA PENILAIAN TERPISAH (NILAI OBJEKTIF & SKOR ISIAN SINGKAT / URAIAN)
  // =========================================================================
  function getObjScore(sesi) {
    if (!sesi) return 0;
    return Number(sesi.nilai_objektif ?? sesi.skor_pg ?? 0);
  }

  function getExamSoalListForJadwal(jadwal) {
    if (!jadwal) return [];
    let selectedIds = [];
    if (Array.isArray(jadwal.soal_ids_json)) {
      selectedIds = jadwal.soal_ids_json.map(id => String(id));
    } else if (typeof jadwal.soal_ids_json === 'string') {
      try {
        const parsedIds = JSON.parse(jadwal.soal_ids_json);
        if (Array.isArray(parsedIds)) selectedIds = parsedIds.map(id => String(id));
      } catch (e) {}
    }
    return state.db.bank_soal
      .filter(s => String(s.mapel_id) === String(jadwal.mapel_id) && (selectedIds.length === 0 || selectedIds.includes(String(s.id))))
      .sort((a, b) => (Number(a.nomor_urut) || 0) - (Number(b.nomor_urut) || 0));
  }

  /**
   * Menghitung skor secara akurat berdasarkan butir soal yang terdaftar pada jadwal ujian:
   * 1. Nilai Objektif: Dihitung dari soal tipe PILIHAN GANDA, PILIHAN GANDA KOMPLEKS, BENAR SALAH, dan MENJODOHKAN.
   * 2. Skor Isian Singkat / Uraian: Input manual guru (rentang 0-100) yang dikalikan secara proporsional
   *    dengan bobot soal non-objektif, atau ditambahkan langsung jika bobot non-objektif belum terdeteksi
   *    (dengan batas maksimal Nilai Akhir = 100).
   */
  function calculateObjectiveScore(soalList, jawabanMap, skorIsianManual = 0) {
    let totalBobotAll = 0;
    let earnedBobotObj = 0;
    let totalBobotIsian = 0;

    (soalList || []).forEach(s => {
      const bobot = Math.max(0, Number(s.bobot) || 10);
      totalBobotAll += bobot;
      const tipe = normalizeTipeSoal(s.tipe_soal);
      const ans = jawabanMap ? jawabanMap[s.id] : undefined;

      // Pisahkan soal Isian Singkat & Uraian ke komponen skor non-objektif (manual guru 0-100)
      if (tipe === 'ISIAN SINGKAT' || tipe === 'URAIAN') {
        totalBobotIsian += bobot;
        return;
      }

      if (ans === undefined || ans === null) return;

      if (tipe === 'PILIHAN GANDA' || tipe === 'BENAR SALAH') {
        const kunci = String(s.kunci_jawaban || '').trim().toUpperCase();
        const jwb = String(ans).trim().toUpperCase();
        if (kunci && jwb === kunci) earnedBobotObj += bobot;
      } else if (tipe === 'PILIHAN GANDA KOMPLEKS') {
        const kunciArr = normalizePgkAnswerArray(s.kunci_jawaban).sort();
        const jwbArr = normalizePgkAnswerArray(ans).sort();
        if (kunciArr.length > 0 && kunciArr.length === jwbArr.length && kunciArr.every((v, i) => v === jwbArr[i])) {
          earnedBobotObj += bobot;
        }
      } else if (tipe === 'MENJODOHKAN') {
        const pairs = normalizePasanganJson(s.pasangan_json);
        const ansObj = normalizeMatchAnswerObj(ans);
        if (pairs.length > 0) {
          let matched = 0;
          pairs.forEach((p, idx) => {
            if (String(ansObj[idx] || '').trim() === String(p.kanan || '').trim()) {
              matched++;
            }
          });
          earnedBobotObj += (matched / pairs.length) * bobot;
        }
      }
    });

    // Kontribusi Nilai Objektif terhadap total seluruh bobot butir soal (skala 0 - 100)
    const objScore = totalBobotAll > 0 ? Math.round((earnedBobotObj / totalBobotAll) * 1000) / 10 : 0;

    // Kontribusi Skor Isian Singkat / Uraian (input 0-100)
    const cleanIsianInput = Math.max(0, Math.min(100, Number(skorIsianManual) || 0));
    const hasProporsiIsian = totalBobotAll > 0 && totalBobotIsian > 0;
    const maxIsianContribution = hasProporsiIsian
      ? Math.round((totalBobotIsian / totalBobotAll) * 1000) / 10
      : 100;

    // Jika jadwal memiliki soal Isian/Uraian berbobot, hitung proporsional; jika tidak terdeteksi, tambahkan langsung
    const isianContribution = hasProporsiIsian
      ? (cleanIsianInput / 100) * ((totalBobotIsian / totalBobotAll) * 100)
      : cleanIsianInput;

    const finalScore = Math.min(100, Math.round((objScore + isianContribution) * 10) / 10);
    return {
      objScore,
      finalScore,
      totalBobotAll,
      totalBobotIsian,
      maxIsianContribution,
      isianContribution: Math.round(isianContribution * 10) / 10
    };
  }

  async function startStudentExam(jadwal, tokenInput) {
    if (state.startingExam) return;

    const cleanToken = String(tokenInput || '').trim().toUpperCase();
    const expectedToken = String(jadwal.token_ujian || '').trim().toUpperCase();
    if (!cleanToken || cleanToken !== expectedToken) {
      showToast('Token ujian tidak sesuai! Periksa kembali token dari pengawas.', 'error');
      return;
    }

    const emuError = detectVirtualAndroidOrEmulator();
    if (emuError) {
      showToast(`Akses ditolak: ${emuError}. Gunakan perangkat resmi.`, 'error');
      return;
    }

    state.startingExam = true;
    render();

    try {
      // Pastikan butir soal untuk mapel ini termuat dari Supabase jika belum ada di memori lokal
      if (!IS_PREVIEW && supabase) {
        const existingInMem = state.db.bank_soal.filter(s => String(s.mapel_id) === String(jadwal.mapel_id));
        if (existingInMem.length === 0) {
          const { data: fetchedSoals, error: soalErr } = await supabase
            .from('bank_soal')
            .select('*')
            .eq('mapel_id', jadwal.mapel_id)
            .order('nomor_urut', { ascending: true });
          if (!soalErr && Array.isArray(fetchedSoals)) {
            state.db.bank_soal.push(...fetchedSoals);
          }
        }
      }

      const mapel = state.db.mata_pelajaran.find(m => String(m.id) === String(jadwal.mapel_id)) || { nama_mapel: 'Mata Pelajaran' };
      let soalList = getExamSoalListForJadwal(jadwal);

      if (soalList.length === 0) {
        showToast('Belum ada butir soal yang disiapkan untuk jadwal ujian ini.', 'error');
        return;
      }

      if (jadwal.acak_soal) {
        soalList = shuffleArray(soalList);
      }

      const optionOrders = {};
      soalList.forEach(s => {
        const tipe = normalizeTipeSoal(s.tipe_soal);
        if (tipe === 'PILIHAN GANDA' || tipe === 'PILIHAN GANDA KOMPLEKS') {
          const keys = ['A', 'B', 'C', 'D'].filter(k => String(s[`opsi_${k.toLowerCase()}`] || '').trim() !== '');
          optionOrders[s.id] = jadwal.acak_opsi ? shuffleArray(keys) : keys;
        } else if (tipe === 'MENJODOHKAN') {
          const pairs = normalizePasanganJson(s.pasangan_json);
          const rightOpts = pairs.map(p => p.kanan);
          optionOrders[s.id] = jadwal.acak_opsi ? shuffleArray(rightOpts) : rightOpts;
        }
      });

      // Cek sesi siswa di memori maupun langsung di Supabase agar tidak duplikat / gagal
      let sesiRecord = state.db.sesi_ujian_siswa.find(
        s => String(s.jadwal_id) === String(jadwal.id) && String(s.siswa_id) === String(state.currentUser.id)
      );

      if (!sesiRecord && !IS_PREVIEW && supabase) {
        const { data: existingSesi } = await supabase
          .from('sesi_ujian_siswa')
          .select('*')
          .eq('jadwal_id', jadwal.id)
          .eq('siswa_id', state.currentUser.id)
          .limit(1)
          .maybeSingle();
        if (existingSesi) {
          sesiRecord = existingSesi;
          state.db.sesi_ujian_siswa.push(existingSesi);
        }
      }

      if (sesiRecord && sesiRecord.status === 'selesai') {
        showToast('Anda sudah menyelesaikan ujian ini.', 'error');
        return;
      }

      if (sesiRecord && sesiRecord.status === 'terkunci') {
        showToast('Sesi ujian Anda sedang terkunci. Minta pengawas membuka kunci terlebih dahulu.', 'error');
        return;
      }

      if (!sesiRecord) {
        const newSesiPayload = {
          jadwal_id: jadwal.id,
          siswa_id: state.currentUser.id,
          waktu_mulai: new Date().toISOString(),
          status: 'mengerjakan',
          jawaban_json: {},
          ragu_json: {},
          jumlah_pelanggaran: 0,
          log_pelanggaran: [],
          skor_pg: 0,
          skor_essay: 0,
          nilai_akhir: 0
        };
        sesiRecord = await dbInsert('sesi_ujian_siswa', newSesiPayload);
      }

      const durasiSec = Math.max(60, (Number(jadwal.durasi_menit) || 60) * 60);
      const elapsedSec = sesiRecord.waktu_mulai
        ? Math.max(0, Math.floor((Date.now() - new Date(sesiRecord.waktu_mulai).getTime()) / 1000))
        : 0;
      const remainingSeconds = Math.max(10, durasiSec - elapsedSec);

      state.modal = null;
      state.exam.active = true;
      state.exam.locked = false;
      state.exam.isSubmitting = false;
      state.exam.finishedHandled = false;
      state.exam.graceUntil = Date.now() + 5000;
      state.exam.lastViolationAt = 0;
      state.exam.jadwal = jadwal;
      state.exam.mapel = mapel;
      state.exam.soalList = soalList;
      state.exam.optionOrders = optionOrders;
      state.exam.currentIndex = 0;
      state.exam.jawaban = { ...(sesiRecord.jawaban_json || {}) };
      state.exam.ragu = { ...(sesiRecord.ragu_json || {}) };
      state.exam.sesiRecord = sesiRecord;
      state.exam.remainingSeconds = remainingSeconds;
      state.exam.showDaftarSoalMobile = false;

      if (mapel.is_english) setAntiTranslate(true);
      unlockAudioContext();
      safeRequestFullscreen();
      setupExamSecurityListeners();

      if (state.exam.timerInterval) clearInterval(state.exam.timerInterval);
      state.exam.timerInterval = setInterval(() => {
        if (!state.exam.active) return;
        state.exam.remainingSeconds -= 1;
        const timerEl = document.getElementById('exam-timer-display');
        if (timerEl) {
          timerEl.textContent = formatRemainingTime(state.exam.remainingSeconds);
        }
        if (state.exam.remainingSeconds <= 0) {
          finishStudentExam(true);
        }
      }, 1000);
    } catch (err) {
      console.error('Gagal memulai ujian:', err);
      showToast('Gagal memulai ujian: ' + (err?.message || 'Periksa koneksi atau skema database.'), 'error');
    } finally {
      state.startingExam = false;
      render();
    }
  }

  async function saveStudentAnswer(soalId, value) {
    if (!state.exam.active || state.exam.locked) return;
    state.exam.jawaban[soalId] = value;
    if (state.exam.sesiRecord) {
      state.exam.sesiRecord.jawaban_json = { ...state.exam.jawaban };
      try {
        await dbUpdate('sesi_ujian_siswa', state.exam.sesiRecord.id, {
          jawaban_json: state.exam.sesiRecord.jawaban_json,
          ragu_json: { ...state.exam.ragu }
        });
      } catch (e) {}
    }
  }

  async function finishStudentExam(autoSubmit = false) {
    if (!state.exam.active || state.exam.isSubmitting || state.exam.finishedHandled) return;
    state.exam.isSubmitting = true;
    state.exam.finishedHandled = true;

    const sesi = state.exam.sesiRecord;
    const existingSkorIsian = Number(sesi?.skor_essay ?? 0);
    const { objScore, finalScore } = calculateObjectiveScore(state.exam.soalList, state.exam.jawaban, existingSkorIsian);

    if (sesi) {
      try {
        await dbUpdate('sesi_ujian_siswa', sesi.id, {
          status: 'selesai',
          waktu_selesai: new Date().toISOString(),
          jawaban_json: { ...state.exam.jawaban },
          ragu_json: { ...state.exam.ragu },
          skor_pg: objScore,
          skor_essay: existingSkorIsian,
          nilai_akhir: finalScore
        });
      } catch (e) {
        try {
          await dbUpdate('sesi_ujian_siswa', sesi.id, {
            status: 'selesai',

            jawaban_json: { ...state.exam.jawaban },
            nilai_akhir: finalScore
          });
        } catch (err2) {}
      }
    }

    cleanupExamEnvironment();
    state.activeMenu = 'daftar_nilai_siswa';
    showToast(autoSubmit ? 'Waktu habis! Jawaban ujian otomatis dikumpulkan.' : 'Ujian selesai! Jawaban Anda berhasil disimpan.');
    render();
  }

  function printAdminDocumentA4() {
    const printArea = document.getElementById('print-area');
    if (!printArea) {
      showToast('Area dokumen cetak tidak ditemukan.', 'error');
      return;
    }

    const docTitles = {
      daftar_hadir: 'Daftar_Hadir_Peserta_CBT',
      kartu_peserta: 'Kartu_Peserta_Ujian_CBT',
      berita_acara: 'Berita_Acara_Ujian_CBT',
      daftar_nilai_pdf: 'Daftar_Nilai_Per_Kelas_CBT'
    };
    const docTitle = docTitles[state.docType] || 'Dokumen_Administrasi_CBT';
    const fullHtml = buildStandalonePrintHtml(docTitle, printArea.innerHTML);

    // Metode 1: Buka jendela cetak khusus (paling kompatibel untuk Blogger & Preview)
    try {
      const printWin = window.open('', '_blank', 'width=900,height=700');
      if (printWin && printWin.document) {
        printWin.document.open();
        printWin.document.write(fullHtml);
        printWin.document.close();
        setTimeout(() => {
          try {
            printWin.focus();
            printWin.print();
          } catch (e) {}
        }, 350);
        return;
      }
    } catch (e) {}

    // Metode 2: Iframe cetak tersembunyi jika popup diblokir browser
    try {
      const oldFrame = document.getElementById('cbt-hidden-print-frame');
      if (oldFrame) oldFrame.remove();

      const iframe = document.createElement('iframe');
      iframe.id = 'cbt-hidden-print-frame';
      iframe.style.position = 'fixed';
      iframe.style.left = '-9999px';
      iframe.style.top = '0';
      iframe.style.width = '210mm';
      iframe.style.height = '297mm';
      iframe.style.border = '0';
      document.body.appendChild(iframe);

      const frameDoc = iframe.contentWindow?.document || iframe.contentDocument;
      if (frameDoc) {
        frameDoc.open();
        frameDoc.write(fullHtml);
        frameDoc.close();
        setTimeout(() => {
          try {
            iframe.contentWindow.focus();
            iframe.contentWindow.print();
          } catch (err) {
            window.print();
          }
        }, 350);
        return;
      }
    } catch (e) {}

    // Metode 3: Cetak halaman langsung dengan CSS @media print yang sudah diperbaiki
    window.print();
  }

  async function downloadWordTemplateDocx() {
    if (typeof JSZip === 'undefined') {
      showToast('Library JSZip belum siap.', 'error');
      return;
    }
    const zip = new JSZip();
    zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`);
    zip.folder('_rels').file('.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`);
    const lines = [
      'TEMPLATE IMPORT SOAL CBT PROMAX',
      '1. Contoh soal pilihan ganda?',
      'A. Pilihan pertama',
      'B. Pilihan kedua',
      'C. Pilihan ketiga',
      'D. Pilihan keempat',
      'KUNCI: A',
      '',
      '2. Contoh soal pilihan ganda kedua?',
      'A. Jawaban A',
      'B. Jawaban B',
      'C. Jawaban C',
      'D. Jawaban D',
      'KUNCI: B'
    ];
    const bodyXml = lines.map(l => `<w:p><w:r><w:t>${escapeHtml(l)}</w:t></w:r></w:p>`).join('');
    zip.folder('word').file('document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${bodyXml}</w:body></w:document>`);

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Template_Soal_CBT_Promax.docx';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Template Word (.docx) berhasil diunduh!');
  }

  async function processWordDocxImport(file, mapelId, kelasTargetStr) {
    if (typeof mammoth === 'undefined') {
      showToast('Library Mammoth Word belum tersedia.', 'error');
      return;
    }
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    const rawLines = result.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

    const parsedQuestions = [];
    let current = null;

    rawLines.forEach(line => {
      const qMatch = line.match(/^(\d+)[\.\)]\s*(.+)$/);
      const optMatch = line.match(/^([A-D])[\.\)]\s*(.+)$/i);
      const keyMatch = line.match(/^KUNCI\s*:\s*([A-D,\s]+)$/i);

      if (qMatch) {
        if (current && current.pertanyaan) parsedQuestions.push(current);
        current = {
          pertanyaan: qMatch[2].trim(),
          opsi_a: '',
          opsi_b: '',
          opsi_c: '',
          opsi_d: '',
          kunci_jawaban: 'A'
        };
      } else if (optMatch && current) {
        const letter = optMatch[1].toLowerCase();
        current[`opsi_${letter}`] = optMatch[2].trim();
      } else if (keyMatch && current) {
        current.kunci_jawaban = keyMatch[1].trim().toUpperCase();
      } else if (current && !current.opsi_a) {
        current.pertanyaan += ' ' + line;
      }
    });
    if (current && current.pertanyaan) parsedQuestions.push(current);

    if (parsedQuestions.length === 0) {
      showToast('Tidak ditemukan butir soal berformat standar (1. Soal / A. Opsi / KUNCI: A) di file Word.', 'error');
      return;
    }

    let startNo = state.db.bank_soal.filter(s => s.mapel_id === mapelId).length + 1;
    for (const q of parsedQuestions) {
      const isMulti = q.kunci_jawaban.includes(',');
      await dbInsert('bank_soal', {
        mapel_id: mapelId,
        kelas_target: kelasTargetStr,
        nomor_urut: startNo++,
        tipe_soal: isMulti ? 'PILIHAN GANDA KOMPLEKS' : 'PILIHAN GANDA',
        pertanyaan: q.pertanyaan,
        gambar_url: '',
        opsi_a: q.opsi_a,
        opsi_b: q.opsi_b,
        opsi_c: q.opsi_c,
        opsi_d: q.opsi_d,
        pasangan_json: [],
        kunci_jawaban: q.kunci_jawaban,
        bobot: 10,
        tingkat: 'Sedang',
        topik: 'Import Word',
        pembahasan: ''
      });
    }

    state.modal = null;
    showToast(`Berhasil mengimpor ${parsedQuestions.length} butir soal dari Word!`);
    render();
  }

  function renderBankSoalView() {

      'from-sky-100/85 to-blue-50 border-sky-300 text-sky-950',
      'from-amber-100/85 to-orange-50 border-amber-300 text-amber-950',
      'from-violet-100/85 to-purple-50 border-violet-300 text-violet-950',
      'from-rose-100/85 to-pink-50 border-rose-300 text-rose-950'
    ];

    const selectedMapelObj = state.filterSoalMapel
      ? authMapels.find(m => m.id === state.filterSoalMapel) || null
      : null;

    const filteredSoal = selectedMapelObj
      ? state.db.bank_soal
          .filter(s => {
            if (s.mapel_id !== selectedMapelObj.id) return false;
            if (state.filterSoalKelas) {
              const targets = parseKelasString(s.kelas_target).map(k => k.toLowerCase());
              if (targets.length > 0 && !targets.includes(state.filterSoalKelas.toLowerCase())) return false;

        ${!selectedMapelObj ? `

                      <div>

                    <div class="flex items-center gap-1.5 shrink-0">

                      <button type="button" data-del-soal="${s.id}" class="px-2.5 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-950 text-xs font-extrabold">🗑️</button>

  function renderMonitoringView() {
    const authMapelIds = getAuthorizedMapelIds();
    const jadwals = state.db.jadwal_ujian.filter(j => authMapelIds.has(j.mapel_id));

    const cfg = getSchoolConfig();
    const maxPelanggaran = Math.max(1, Number(cfg.max_pelanggaran) || 3);
    const activeJadwal = state.filterMonitoringJadwal
      ? jadwals.find(j => j.id === state.filterMonitoringJadwal) || null
      : null;
    const targetClasses = activeJadwal ? parseKelasString(activeJadwal.kelas_target).map(k => k.toLowerCase()) : [];

    const pesertaList = activeJadwal
      ? state.db.users_cbt
          .filter(u => {
            if (u.role !== 'siswa') return false;
            if (targetClasses.length > 0 && !targetClasses.includes((u.kelas || '').toLowerCase())) return false;
            if (state.filterMonitoringKelas && (u.kelas || '').toLowerCase() !== state.filterMonitoringKelas.toLowerCase()) return false;
            if (state.filterMonitoringSearch) {
              const q = state.filterMonitoringSearch.toLowerCase();
              if (!(u.nama_lengkap || '').toLowerCase().includes(q) && !(u.nomor_peserta || '').toLowerCase().includes(q)) return false;
            }
            return true;
          })
          .sort((a, b) => (a.nama_lengkap || '').localeCompare(b.nama_lengkap || ''))
      : [];

    return `
      <div class="space-y-4">
        <div class="glass-panel rounded-3xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-gradient-to-r from-rose-50/85 via-amber-50/85 to-emerald-50/85">
          <div>
            <h2 class="text-lg font-extrabold text-slate-900">Monitoring Peserta Live</h2>
            <p class="text-xs text-slate-600">Klik salah satu box jadwal ujian di bawah untuk memantau peserta ujian, pelanggaran, dan buka kunci.</p>
          </div>
          <button id="btn-refresh-monitoring" type="button" class="px-4 py-2 rounded-xl bg-emerald-700 text-white text-xs font-extrabold">
            ↻ Refresh Data Live
          </button>
        </div>

        <!-- Kartu Toggle Jadwal / Peserta Ujian Berwarna -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          ${jadwals.length === 0 ? `
            <div class="col-span-full glass-panel rounded-2xl p-6 text-center text-xs text-slate-500">
              Belum ada jadwal ujian yang tersedia untuk dipantau.
            </div>
          ` : jadwals.map((jd, idx) => {
            const mp = state.db.mata_pelajaran.find(m => m.id === jd.mapel_id) || { nama_mapel: '-' };
            const active = activeJadwal?.id === jd.id;
            const jdClasses = parseKelasString(jd.kelas_target).map(k => k.toLowerCase());
            const totalPesertaJadwal = state.db.users_cbt.filter(u => u.role === 'siswa' && (jdClasses.length === 0 || jdClasses.includes((u.kelas || '').toLowerCase()))).length;
            const tones = [
              'from-emerald-100/85 to-teal-50 border-emerald-300 text-emerald-950',
              'from-sky-100/85 to-blue-50 border-sky-300 text-sky-950',
              'from-amber-100/85 to-orange-50 border-amber-300 text-amber-950'
            ];
            return `
              <button type="button" data-select-mon-jadwal="${jd.id}"
                class="p-3.5 rounded-2xl border text-left transition bg-gradient-to-br ${tones[idx % tones.length]} ${active ? 'ring-2 ring-emerald-700 shadow-md scale-[1.01]' : 'opacity-85 hover:opacity-100'}">
                <div class="text-xs font-extrabold">${escapeHtml(mp.nama_mapel)} • Token: <span class="font-mono">${escapeHtml(jd.token_ujian)}</span></div>
                <div class="text-sm font-extrabold truncate">${escapeHtml(jd.judul_ujian)}</div>
                <div class="text-[11px] font-bold mt-0.5">Kelas: ${escapeHtml(jd.kelas_target)} • ${totalPesertaJadwal} Peserta</div>
              </button>
            `;
          }).join('')}
        </div>

        ${!activeJadwal ? `
          <div class="glass-panel rounded-3xl p-8 text-center space-y-1.5 bg-gradient-to-r from-rose-50/50 via-amber-50/50 to-emerald-50/50">
            <div class="text-base font-extrabold text-slate-800">👆 Silakan Klik Salah Satu Box Peserta / Jadwal Ujian di Atas</div>
            <p class="text-xs text-slate-600">Daftar peserta ujian beserta status pengerjaan akan ditampilkan setelah Anda mengklik box jadwal di atas.</p>
          </div>
        ` : `
          <!-- Filter Kelas & Cari Peserta -->
          <div class="glass-panel rounded-2xl p-3.5 flex flex-wrap items-center gap-2.5">
            <span class="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-950 text-xs font-extrabold">
              Jadwal: ${escapeHtml(activeJadwal.judul_ujian)}
            </span>
            <select id="filter-mon-kelas" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold">
              <option value="">Semua Kelas</option>
              ${getAllMasterClasses().map(k => `<option value="${k}" ${state.filterMonitoringKelas === k ? 'selected' : ''}>Kelas ${escapeHtml(k)}</option>`).join('')}
            </select>
            <input id="filter-mon-search" type="text" value="${escapeHtml(state.filterMonitoringSearch)}" placeholder="Cari nama / nomor peserta..."
              class="flex-1 min-w-[180px] px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold" />
          </div>

          <!-- Tabel Monitoring -->
          <div class="glass-panel rounded-3xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-slate-100/90 border-b border-slate-200 text-slate-700 font-extrabold">
                    <th class="p-3.5">Peserta &amp; Kelas</th>
                    <th class="p-3.5">Status Ujian</th>
                    <th class="p-3.5">Progres</th>
                    <th class="p-3.5">Pelanggaran</th>
                    <th class="p-3.5 text-right">Aksi Pengawas</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200/70">
                  ${pesertaList.length === 0 ? `
                    <tr><td colspan="5" class="p-6 text-center text-slate-500">Tidak ada data peserta untuk filter ini.</td></tr>
                  ` : pesertaList.map(u => {
                    const sesi = state.db.sesi_ujian_siswa.find(s => s.jadwal_id === activeJadwal.id && s.siswa_id === u.id);
                    const pelanggaran = Number(sesi?.jumlah_pelanggaran) || 0;
                    const isLocked = sesi?.status === 'terkunci' || pelanggaran >= maxPelanggaran;
                    const answeredCount = sesi?.jawaban_json ? Object.keys(sesi.jawaban_json).length : 0;
                    const totalSoal = activeJadwal?.jumlah_soal || 0;

                    let statusBadge = `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-bold">Belum Mulai</span>`;
                    if (sesi?.status === 'selesai') {
                      statusBadge = `<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-900 font-extrabold">✓ Selesai (${sesi.nilai_akhir})</span>`;
                    } else if (isLocked) {
                      statusBadge = `<span class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-900 font-extrabold animate-pulse">🔒 TERKUNCI</span>`;
                    } else if (sesi?.status === 'mengerjakan') {
                      statusBadge = `<span class="px-2.5 py-1 rounded-full bg-sky-100 text-sky-900 font-extrabold">● Mengerjakan</span>`;
                    }

                    return `
                      <tr class="hover:bg-slate-50/80">
                        <td class="p-3.5">
                          <div class="font-extrabold text-slate-900">${escapeHtml(u.nama_lengkap)}</div>
                          <div class="text-[11px] text-slate-500">Kelas ${escapeHtml(u.kelas)} • ${escapeHtml(u.nomor_peserta || u.username)}</div>

  function renderStudentDashboardView() {
    const user = state.currentUser;
    const studentKelas = (user.kelas || '').trim().toLowerCase().replace(/\s+/g, '');
    const studentAgama = (user.agama || '').trim().toLowerCase();

    const availableJadwals = state.db.jadwal_ujian.filter(jd => {
      if (getEffectiveJadwalStatus(jd) !== 'Aktif') return false;
      const targets = parseKelasString(jd.kelas_target).map(k => k.toLowerCase().replace(/\s+/g, ''));
      if (targets.length > 0 && !targets.includes('semua') && !targets.includes(studentKelas)) return false;
      const mp = state.db.mata_pelajaran.find(m => String(m.id) === String(jd.mapel_id));
      if (mp && mp.kategori_agama && mp.kategori_agama.trim().toLowerCase() !== studentAgama) return false;
      return true;
    });

    return `
      <div class="space-y-5">
        <div class="glass-panel rounded-3xl p-5 bg-gradient-to-r from-emerald-50/90 via-sky-50/85 to-amber-50/85 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-extrabold text-slate-900">Ruang Ujian Siswa — ${escapeHtml(user.nama_lengkap)}</h2>
            <p class="text-xs text-slate-600 mt-0.5">
              No. Peserta: <strong>${escapeHtml(user.nomor_peserta || '-')}</strong> • Kelas: <strong>${escapeHtml(user.kelas)}</strong> • ${escapeHtml(user.ruang_sesi || 'Sesi 1')}
            </p>
          </div>
          <button type="button" data-nav-menu="daftar_nilai_siswa" class="px-4 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-950 text-xs font-extrabold self-start sm:self-auto">
            🏆 Lihat Daftar Nilai →
          </button>
        </div>

        <!-- Daftar Jadwal Ujian Aktif -->
        <div class="space-y-2.5">
          <h3 class="text-sm font-extrabold text-slate-900 px-1">📝 Jadwal Ujian Aktif</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${availableJadwals.length === 0 ? `
              <div class="col-span-full glass-panel rounded-3xl p-8 text-center text-xs text-slate-500">
                Belum ada jadwal ujian aktif untuk kelas <strong>${escapeHtml(user.kelas)}</strong> saat ini.
              </div>
            ` : availableJadwals.map(jd => {
              const mp = state.db.mata_pelajaran.find(m => String(m.id) === String(jd.mapel_id)) || { nama_mapel: 'Mata Pelajaran' };
              const sesi = state.db.sesi_ujian_siswa.find(s => String(s.jadwal_id) === String(jd.id) && String(s.siswa_id) === String(user.id));
              const isSelesai = sesi?.status === 'selesai';
              const isTerkunci = sesi?.status === 'terkunci';

              return `
                <div class="glass-panel rounded-3xl p-5 border-2 ${isSelesai ? 'border-emerald-300 bg-emerald-50/40' : 'border-sky-200 bg-gradient-to-br from-white to-sky-50/60'} space-y-3">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-900 text-[11px] font-extrabold">
                        ${escapeHtml(mp.nama_mapel)}
                      </span>
                      <h3 class="text-base font-extrabold text-slate-900 mt-1.5">${escapeHtml(jd.judul_ujian)}</h3>
                    </div>
                    <span class="px-2.5 py-1 rounded-xl bg-amber-100 text-amber-950 text-xs font-extrabold">
                      ⏱ ${jd.durasi_menit} Menit
                    </span>
                  </div>

                  <div class="text-xs text-slate-600 space-y-1">
                    <div>Jumlah Soal: <strong>${jd.jumlah_soal} Butir</strong></div>
                    <div>Batas Selesai: <strong>${formatDateTimeWita(jd.waktu_selesai)}</strong></div>

                  <div class="pt-2">

                      <div class="w-full py-2.5 px-4 rounded-2xl bg-emerald-100 border border-emerald-300 text-emerald-950 text-center text-xs font-extrabold">
                        ✓ Ujian Telah Selesai Dikerjakan (Nilai: ${sesi.nilai_akhir ?? 0})
                      </div>
                    ` : isTerkunci ? `
                      <div class="w-full py-2.5 px-4 rounded-2xl bg-rose-100 border border-rose-300 text-rose-900 text-center text-xs font-extrabold">
                        🔒 Sesi Terkunci — Hubungi Pengawas Ruang
                      </div>
                    ` : `
                      <button type="button" data-open-token-modal="${jd.id}"
                        class="w-full py-3 px-4 rounded-2xl bg-gradient-to-r from-[#4f6d4a] to-emerald-700 hover:from-emerald-800 hover:to-teal-800 text-white text-xs font-extrabold shadow-md cursor-pointer">
                        ${sesi ? '▶ Lanjutkan Ujian' : '🚀 Kerjakan Ujian Sekarang'}
                      </button>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
    `;

  function renderStudentNilaiView() {
    const user = state.currentUser;
    const completedSessions = state.db.sesi_ujian_siswa

      .sort((a, b) => new Date(b.waktu_selesai || b.waktu_mulai || 0) - new Date(a.waktu_selesai || a.waktu_mulai || 0));

    const rataRata = completedSessions.length > 0

  function renderStudentExamView() {
    const ex = state.exam;
    const soal = ex.soalList[ex.currentIndex];
    if (!soal) return '';

    const tipe = normalizeTipeSoal(soal.tipe_soal);
    const currentAns = ex.jawaban[soal.id];
    const isRagu = !!ex.ragu[soal.id];

    const fontClasses = {
      base: { q: 'text-sm sm:text-base leading-relaxed', opt: 'text-xs sm:text-sm leading-relaxed' },
      lg: { q: 'text-base sm:text-lg leading-relaxed', opt: 'text-sm sm:text-base leading-relaxed' },
      xl: { q: 'text-lg sm:text-xl leading-loose', opt: 'text-base sm:text-lg leading-loose' }
    }[ex.fontSize] || { q: 'text-sm sm:text-base leading-relaxed', opt: 'text-xs sm:text-sm leading-relaxed' };

    let answerAreaHtml = '';
    if (tipe === 'PILIHAN GANDA') {
      const order = ex.optionOrders[soal.id] || ['A', 'B', 'C', 'D'];
      answerAreaHtml = `
        <div class="space-y-2.5">
          ${order.map((origKey, idx) => {
            const displayLabel = ['A', 'B', 'C', 'D'][idx] || origKey;

      `;
    } else if (tipe === 'PILIHAN GANDA KOMPLEKS') {
      const order = ex.optionOrders[soal.id] || ['A', 'B', 'C', 'D'];

      answerAreaHtml = `
        <div class="space-y-2.5">

          ${order.map((origKey, idx) => {
            const displayLabel = ['A', 'B', 'C', 'D'][idx] || origKey;

            const checked = selectedArr.includes(origKey);
            return `
              <button type="button" data-toggle-pgk="${origKey}"

            `;

      `;
    } else if (tipe === 'BENAR SALAH') {

      const ansObj = normalizeMatchAnswerObj(currentAns);
      answerAreaHtml = `
        <div class="space-y-2.5">

    } else if (tipe === 'ISIAN SINGKAT') {

            </div>
            <button id="btn-toggle-nav-soal" type="button" class="lg:hidden px-2.5 py-1.5 rounded-xl bg-sky-100 border border-sky-200 text-sky-950 text-[11px] font-extrabold whitespace-nowrap">

                    <span class="px-3 py-1 rounded-xl bg-[#4f6d4a] text-white text-xs font-extrabold">

                    </span>
                    <span class="px-3 py-1 rounded-xl bg-sky-100 text-sky-950 text-xs font-extrabold">
                      ${escapeHtml(tipe)}

                <!-- Pengatur Size Font tepat di bawah Tipe Soal -->

                      { id: 'lg', label: 'A+' },
                      { id: 'xl', label: 'A++' }

                      <button type="button" data-exam-font="${sz.id}"
                        class="px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${ex.fontSize === sz.id ? 'bg-emerald-700 text-white shadow-xs' : 'text-slate-700 hover:bg-white'}">
                        ${sz.label}
                      </button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <!-- Pertanyaan & Gambar -->
              <div class="exam-question-read space-y-3">
                <div class="${fontClasses.q} font-semibold text-slate-900 whitespace-pre-line">
                  ${escapeHtml(soal.pertanyaan)}
                </div>
                ${soal.gambar_url ? `
                  <div class="pt-1">
                    <img src="${soal.gambar_url}" alt="Gambar Soal" class="max-h-64 rounded-2xl border border-slate-200 shadow-xs" />

              <!-- Area Pilihan / Input Jawaban -->
              <div class="pt-2">
                ${answerAreaHtml}

            </div>

            <!-- Tombol Navigasi Bawah -->
            <div class="flex flex-wrap items-center justify-between gap-2">
              <button id="btn-prev-soal" type="button" ${ex.currentIndex === 0 ? 'disabled' : ''}

              </button>

                class="px-4 py-3 rounded-2xl border text-xs font-extrabold ${isRagu ? 'bg-amber-400 border-amber-500 text-slate-950' : 'bg-amber-50 border-amber-300 text-amber-900'}">

              </button>

              ${ex.currentIndex < ex.soalList.length - 1 ? `
                <button id="btn-next-soal" type="button"
                  class="px-5 py-3 rounded-2xl bg-[#4f6d4a] text-white text-xs font-extrabold shadow-xs">
                  Selanjutnya →
                </button>
              ` : `
                <button id="btn-finish-exam" type="button"
                  class="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-md">
                  ✓ Selesai &amp; Kumpulkan
                </button>
              `}
            </div>
          </div>

          <!-- Panel Navigasi Nomor Soal -->
          <div class="lg:col-span-4 ${ex.showDaftarSoalMobile ? 'block' : 'hidden lg:block'}">

              <div class="flex items-center justify-between">
                <h3 class="text-xs font-extrabold uppercase tracking-wide text-slate-700">Navigasi Nomor Soal</h3>
                <span class="text-[11px] font-bold text-emerald-800">
                  Terjawab: ${ex.soalList.filter(s => isSoalAnswered(s, ex.jawaban[s.id])).length}/${ex.soalList.length}
                </span>
              </div>

              <div class="grid grid-cols-5 gap-2">
                ${ex.soalList.map((s, idx) => {
                  const answered = isSoalAnswered(s, ex.jawaban[s.id]);
                  const ragu = !!ex.ragu[s.id];
                  const active = idx === ex.currentIndex;
                  let cls = 'bg-white border-slate-300 text-slate-700';
                  if (ragu) cls = 'bg-amber-300 border-amber-500 text-slate-950';
                  else if (answered) cls = 'bg-emerald-600 border-emerald-700 text-white';

                  return `
                    <button type="button" data-jump-soal="${idx}"
                      class="h-10 rounded-xl border-2 text-xs font-extrabold transition ${cls} ${active ? 'ring-2 ring-sky-500 scale-105' : ''}">
                      ${idx + 1}
                    </button>
                  `;
                }).join('')}
              </div>

              <div class="pt-2 border-t border-slate-200">
                <button id="btn-finish-exam-side" type="button"
                  class="w-full py-3 px-4 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold shadow-xs">
                  ✓ Selesai Ujian
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // =========================================================================

  function renderModalOverlay() {
    if (!state.modal) return '';
    const m = state.modal;
    let title = '';
    let body = '';

    if (m.type === 'soal') {
      const existing = m.data;
      title = existing ? 'Edit Butir Soal' : 'Tambah Butir Soal Baru';
      const authMapels = getAuthorizedMapels();
      const mapelId = state.modalSoalDraft?.mapel_id || existing?.mapel_id || state.filterSoalMapel || authMapels[0]?.id || '';
      const authKelas = getAuthorizedKelasList(mapelId);

      if (!state.modalSoalDraft) {
        const parsedPasangan = existing ? normalizePasanganJson(existing.pasangan_json) : [];
        state.modalSoalDraft = {
          mapel_id: mapelId,
          nomor_urut: existing ? (Number(existing.nomor_urut) || 1) : (state.db.bank_soal.filter(s => s.mapel_id === mapelId).length + 1),
          tipe_soal: existing ? normalizeTipeSoal(existing.tipe_soal) : 'PILIHAN GANDA',
          pertanyaan: existing ? String(existing.pertanyaan || '') : '',
          opsi_a: existing ? String(existing.opsi_a || '') : '',
          opsi_b: existing ? String(existing.opsi_b || '') : '',
          opsi_c: existing ? String(existing.opsi_c || '') : '',
          opsi_d: existing ? String(existing.opsi_d || '') : '',
          pasangan: parsedPasangan.length >= 2 ? parsedPasangan : [{ kiri: '', kanan: '' }, { kiri: '', kanan: '' }, { kiri: '', kanan: '' }],
          kunci_jawaban: existing ? String(existing.kunci_jawaban || '') : 'A',
          bobot: existing ? (Number(existing.bobot) || 10) : 10,
          topik: existing ? String(existing.topik || 'Umum') : 'Umum'
        };

      const d = state.modalSoalDraft;
      const tipe = normalizeTipeSoal(d.tipe_soal);
      const selectedKelas = state.modalSoalSelectedKelas.size > 0
        ? state.modalSoalSelectedKelas
        : new Set(existing ? parseKelasString(existing.kelas_target) : authKelas);

                      <input type="radio" name="kunci_pg_radio" value="${huruf}" ${curKunci === huruf ? 'checked' : ''} />
