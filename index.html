          <div class="p-3 rounded-2xl bg-gradient-to-r from-emerald-50 to-sky-50 border border-emerald-200 grid grid-cols-3 gap-2 text-center">
            <div>
              <div class="text-[10px] font-bold text-slate-500 uppercase">Nilai Objektif</div>
              <div class="text-sm font-extrabold text-slate-900">${liveCalc.objScore}</div>
            </div>
            <div>
              <div class="text-[10px] font-bold text-slate-500 uppercase">Bobot Isian/Uraian</div>
              <div class="text-sm font-extrabold text-sky-900">Maks +${liveCalc.maxIsianContribution}</div>
            </div>
            <div>
              <div class="text-[10px] font-bold text-slate-500 uppercase">Nilai Akhir</div>
              <div id="modal-essay-preview-akhir" class="text-sm font-extrabold text-emerald-800">${liveCalc.finalScore}</div>
            </div>
          </div>

          <div class="max-h-60 overflow-y-auto space-y-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-200">
            ${nonObjSoals.length === 0 ? '<div class="text-slate-500">Tidak ada soal Isian Singkat atau Uraian pada jadwal ini.</div>' : nonObjSoals.map((es, i) => `
              <div class="p-3 rounded-xl bg-white border border-slate-200 space-y-1">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-extrabold text-slate-800">Soal ${i + 1}: ${escapeHtml(es.pertanyaan)}</span>
                  <span class="px-2 py-0.5 rounded-md bg-sky-100 text-sky-900 text-[10px] font-extrabold shrink-0">${escapeHtml(normalizeTipeSoal(es.tipe_soal))} (Bobot ${es.bobot})</span>
                </div>
                <div class="text-[11px] text-emerald-800 font-bold">Kunci/Pedoman: ${escapeHtml(es.kunci_jawaban || '-')}</div>
                <div class="p-2 rounded-lg bg-slate-50 text-slate-800 whitespace-pre-line">
                  <strong>Jawaban Siswa:</strong> ${escapeHtml(sesi.jawaban_json?.[es.id] || '(Tidak dijawab)')}
                </div>
              </div>
            `).join('')}
          </div>
          <div>
            <label class="block font-bold mb-1">Input Skor Isian Singkat / Uraian (Rentang 0 – 100):</label>
            <input id="modal-input-skor-isian" type="number" min="0" max="100" step="0.5" name="skor_essay" value="${sesi.skor_essay ?? 0}" required
              class="w-full px-3 py-2.5 rounded-xl border-2 border-sky-400 font-extrabold text-sm text-sky-950" />
            <p class="text-[11px] text-slate-500 mt-1">Nilai Akhir otomatis bertambah proporsional sesuai bobot soal (batas maksimal 100).</p>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" data-close-modal class="px-4 py-2 rounded-xl bg-slate-100 font-bold">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-[#4f6d4a] text-white font-extrabold">💾 Simpan &amp; Hitung Nilai Akhir</button>
          </div>
        </form>
      `;
    }

    return `
      <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h3 class="font-extrabold text-sm sm:text-base text-slate-900">${escapeHtml(title)}</h3>
            <button type="button" data-close-modal class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold">✕</button>
          </div>
          <div class="p-5 overflow-y-auto">
            ${body}
          </div>
        </div>
      </div>
    `;
  }

  function renderConfirmModal() {
    if (!state.confirmDialog) return '';
    const c = state.confirmDialog;
    const isDanger = c.variant === 'danger';
    return `
      <div class="fixed inset-0 z-[70] bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
          <div class="flex items-start gap-3">
            <div class="w-11 h-11 rounded-2xl ${isDanger ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-800'} flex items-center justify-center text-xl font-extrabold shrink-0">
              ${isDanger ? '!' : '?'}
            </div>
            <div>
              <h3 class="text-base font-extrabold text-slate-900">${escapeHtml(c.title)}</h3>
              <p class="text-xs text-slate-600 mt-1 leading-relaxed">${escapeHtml(c.message)}</p>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button id="btn-confirm-cancel" type="button" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
              Batal
            </button>
            <button id="btn-confirm-ok" type="button" class="px-4 py-2.5 rounded-xl ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-[#4f6d4a] hover:bg-emerald-800'} text-white text-xs font-extrabold">
              ${escapeHtml(c.confirmLabel)}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  // =========================================================================
  // RENDER ENGINE & EVENT BINDINGS
  // =========================================================================
  function render() {
    const root = document.getElementById('cbt-promax-root');
    if (!root) return;

    let mainHtml = '';
    if (!state.currentUser) {
      mainHtml = renderLoginView();
    } else if (state.exam.active) {
      mainHtml = renderStudentExamView();
    } else if (state.currentUser.role === 'siswa') {
      const studentContent = state.activeMenu === 'daftar_nilai_siswa'
        ? renderStudentNilaiView()
        : renderStudentDashboardView();
      mainHtml = renderAppShell(studentContent);
    } else {
      let pageHtml = '';
      switch (state.activeMenu) {
        case 'bank_soal': pageHtml = renderBankSoalView(); break;
        case 'jadwal_ujian': pageHtml = renderJadwalUjianView(); break;
        case 'monitoring': pageHtml = renderMonitoringView(); break;
        case 'rekap_nilai': pageHtml = renderRekapNilaiView(); break;
        case 'users': pageHtml = renderUsersView(); break;
        case 'mapel': pageHtml = renderMapelView(); break;
        case 'cetak_dokumen': pageHtml = renderCetakDokumenView(); break;
        case 'pengaturan': pageHtml = renderPengaturanView(); break;
        default: pageHtml = renderDashboardView(); break;
      }
      mainHtml = renderAppShell(pageHtml);
    }

    const toastHtml = state.toast ? `
      <div class="fixed bottom-4 right-4 z-[80] max-w-sm px-4 py-3 rounded-2xl shadow-xl border text-xs font-extrabold flex items-center gap-2.5 ${state.toast.type === 'error' ? 'bg-rose-950 text-rose-100 border-rose-500' : 'bg-emerald-950 text-emerald-100 border-emerald-500'}">
        <span>${state.toast.type === 'error' ? '⚠️' : '✅'}</span>
        <span>${escapeHtml(state.toast.message)}</span>
      </div>
    ` : '';

    root.innerHTML = mainHtml + renderModalOverlay() + renderConfirmModal() + toastHtml;
    attachEventListeners();
  }

  function attachEventListeners() {
    // Login
    const formLogin = document.getElementById('form-login');
    if (formLogin) {
      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('login-username')?.value || '';
        const p = document.getElementById('login-password')?.value || '';
        handleLogin(u, p);
      });
    }

    const btnTogglePass = document.getElementById('btn-toggle-pass');
    if (btnTogglePass) {
      btnTogglePass.addEventListener('click', () => {
        const inp = document.getElementById('login-password');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
      });
    }

    // Sidebar & Logout
    const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
    if (btnToggleSidebar) {
      btnToggleSidebar.addEventListener('click', () => {
        state.sidebarOpen = !state.sidebarOpen;
        render();
      });
    }

    const btnLogout = document.getElementById('btn-logout');
    if (btnLogout) {
      btnLogout.addEventListener('click', () => handleLogout());
    }

    document.querySelectorAll('[data-nav-menu]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeMenu = btn.getAttribute('data-nav-menu');
        if (window.innerWidth < 1024) state.sidebarOpen = false;
        render();
      });
    });

    // Tutup Modal & Confirm Dialog
    document.querySelectorAll('[data-close-modal]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.modal = null;
        state.modalSoalDraft = null;
        state.modalSoalImagePreview = '';
        render();
      });
    });

    const btnConfirmCancel = document.getElementById('btn-confirm-cancel');
    if (btnConfirmCancel) {
      btnConfirmCancel.addEventListener('click', () => {
        state.confirmDialog = null;
        render();
      });
    }
    const btnConfirmOk = document.getElementById('btn-confirm-ok');
    if (btnConfirmOk) {
      btnConfirmOk.addEventListener('click', async () => {
        const fn = state.confirmDialog?.onConfirm;
        state.confirmDialog = null;
        render();
        if (typeof fn === 'function') await fn();
      });
    }

    // Bank Soal Events
    document.querySelectorAll('[data-select-soal-mapel]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-select-soal-mapel');
        state.filterSoalMapel = state.filterSoalMapel === id ? '' : id;
        state.selectedIds.soal.clear();
        render();
      });
    });

    const filterSoalKelas = document.getElementById('filter-soal-kelas');
    if (filterSoalKelas) {
      filterSoalKelas.addEventListener('change', (e) => {
        state.filterSoalKelas = e.target.value;
        state.selectedIds.soal.clear();
        render();
      });
    }

    const chkAllSoal = document.getElementById('chk-all-soal');
    if (chkAllSoal) {
      chkAllSoal.addEventListener('change', (e) => {
        document.querySelectorAll('[data-chk-item="soal"]').forEach(cb => {
          if (e.target.checked) state.selectedIds.soal.add(cb.value);
          else state.selectedIds.soal.delete(cb.value);
        });
        render();
      });
    }

    document.querySelectorAll('[data-chk-item]').forEach(cb => {
      cb.addEventListener('change', () => {
        const grp = cb.getAttribute('data-chk-item');
        if (cb.checked) state.selectedIds[grp].add(cb.value);
        else state.selectedIds[grp].delete(cb.value);
        render();
      });
    });

    const btnBulkDelSoal = document.getElementById('btn-bulk-del-soal');
    if (btnBulkDelSoal) {
      btnBulkDelSoal.addEventListener('click', () => {
        const ids = [...state.selectedIds.soal];
        openConfirmDialog({
          title: 'Hapus Butir Soal Terpilih',
          message: `Yakin ingin menghapus ${ids.length} butir soal yang dicentang?`,
          confirmLabel: 'Ya, Hapus',
          variant: 'danger',
          onConfirm: async () => {
            await dbDeleteMany('bank_soal', ids);
            state.selectedIds.soal.clear();
            showToast(`${ids.length} butir soal berhasil dihapus.`);
            render();
          }
        });
      });
    }

    const btnDownloadWordTpl = document.getElementById('btn-download-word-tpl');
    if (btnDownloadWordTpl) btnDownloadWordTpl.addEventListener('click', () => downloadWordTemplateDocx());

    const btnOpenImportWord = document.getElementById('btn-open-import-word');
    if (btnOpenImportWord) {
      btnOpenImportWord.addEventListener('click', () => {
        const authMapels = getAuthorizedMapels();
        if (authMapels.length === 0) {
          showToast('Belum ada mata pelajaran yang tersedia.', 'error');
          return;
        }
        state.modalImportMapelId = state.filterSoalMapel || authMapels[0].id;
        state.modalImportSelectedKelas = new Set(getAuthorizedKelasList(state.modalImportMapelId));
        state.modal = { type: 'import_word' };
        render();
      });
    }

    const importWordMapel = document.getElementById('import-word-mapel');
    if (importWordMapel) {
      importWordMapel.addEventListener('change', (e) => {
        state.modalImportMapelId = e.target.value;
        state.modalImportSelectedKelas = new Set(getAuthorizedKelasList(state.modalImportMapelId));
        render();
      });
    }

    const formImportWord = document.getElementById('form-import-word');
    if (formImportWord) {
      formImportWord.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInp = document.getElementById('input-word-docx');
        const file = fileInp?.files?.[0];
        if (!file) return;
        const mapelId = formImportWord.querySelector('[name="mapel_id"]').value;
        const kelasChecked = [...formImportWord.querySelectorAll('.chk-import-kelas:checked')].map(c => c.value);
        await processWordDocxImport(file, mapelId, kelasChecked.join(', '));
      });
    }

    const btnOpenAddSoal = document.getElementById('btn-open-add-soal');
    if (btnOpenAddSoal) {
      btnOpenAddSoal.addEventListener('click', () => {
        const authMapels = getAuthorizedMapels();
        if (authMapels.length === 0) {
          showToast('Tambahkan mata pelajaran terlebih dahulu.', 'error');
          return;
        }
        const mId = state.filterSoalMapel || authMapels[0].id;
        state.modalSoalDraft = null;
        state.modalSoalImagePreview = '';
        state.modalSoalSelectedKelas = new Set(getAuthorizedKelasList(mId));
        state.modal = { type: 'soal', data: null };
        render();
      });
    }

    document.querySelectorAll('[data-edit-soal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-soal');
        const s = state.db.bank_soal.find(x => x.id === id);
        if (!s) return;
        state.modalSoalDraft = null;
        state.modalSoalImagePreview = s.gambar_url || '';
        state.modalSoalSelectedKelas = new Set(parseKelasString(s.kelas_target));
        state.modal = { type: 'soal', data: s };
        render();
      });
    });

    document.querySelectorAll('[data-del-soal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-del-soal');
        openConfirmDialog({
          title: 'Hapus Butir Soal',
          message: 'Yakin ingin menghapus butir soal ini?',
          confirmLabel: 'Ya, Hapus',
          variant: 'danger',
          onConfirm: async () => {
            await dbDeleteMany('bank_soal', [id]);
            showToast('Butir soal berhasil dihapus.');
            render();
          }
        });
      });
    });

    // Modal Soal Dynamic Listeners
    const syncSoalDraftFromForm = () => {
      const f = document.getElementById('form-save-soal');
      if (!f || !state.modalSoalDraft) return;
      state.modalSoalDraft.mapel_id = f.querySelector('[name="mapel_id"]')?.value || state.modalSoalDraft.mapel_id;
      state.modalSoalDraft.nomor_urut = Number(f.querySelector('[name="nomor_urut"]')?.value) || 1;
      state.modalSoalDraft.bobot = Number(f.querySelector('[name="bobot"]')?.value) || 10;
      state.modalSoalDraft.pertanyaan = f.querySelector('[name="pertanyaan"]')?.value || '';
      ['a', 'b', 'c', 'd'].forEach(l => {
        const inp = f.querySelector(`[name="opsi_${l}"]`);
        if (inp) state.modalSoalDraft[`opsi_${l}`] = inp.value;
      });
      const pgRadio = f.querySelector('input[name="kunci_pg_radio"]:checked');
      if (pgRadio) state.modalSoalDraft.kunci_jawaban = pgRadio.value;
      const pgkChks = [...f.querySelectorAll('.chk-kunci-pgk:checked')].map(c => c.value);
      if (f.querySelectorAll('.chk-kunci-pgk').length > 0) state.modalSoalDraft.kunci_jawaban = pgkChks.join(', ');
      const bsRadio = f.querySelector('input[name="kunci_bs_radio"]:checked');
      if (bsRadio) state.modalSoalDraft.kunci_jawaban = bsRadio.value;
      const kiriInps = [...f.querySelectorAll('[data-pasangan-kiri]')];
      if (kiriInps.length > 0) {
        state.modalSoalDraft.pasangan = kiriInps.map((kInp, idx) => ({
          kiri: kInp.value,
          kanan: f.querySelector(`[data-pasangan-kanan="${idx}"]`)?.value || ''
        }));
      }
      const txtKunci = f.querySelector('[name="kunci_jawaban"]');
      if (txtKunci) state.modalSoalDraft.kunci_jawaban = txtKunci.value;
      state.modalSoalSelectedKelas = new Set([...f.querySelectorAll('.chk-soal-kelas:checked')].map(c => c.value));
    };

    const modalSoalTipe = document.getElementById('modal-soal-tipe');
    if (modalSoalTipe) {
      modalSoalTipe.addEventListener('change', (e) => {
        syncSoalDraftFromForm();
        const nextTipe = normalizeTipeSoal(e.target.value);
        state.modalSoalDraft.tipe_soal = nextTipe;
        if (nextTipe === 'PILIHAN GANDA') state.modalSoalDraft.kunci_jawaban = 'A';
        else if (nextTipe === 'PILIHAN GANDA KOMPLEKS') state.modalSoalDraft.kunci_jawaban = 'A, B';
        else if (nextTipe === 'BENAR SALAH') state.modalSoalDraft.kunci_jawaban = 'BENAR';
        else if (nextTipe === 'MENJODOHKAN') state.modalSoalDraft.kunci_jawaban = 'SESUAI PASANGAN';
        else state.modalSoalDraft.kunci_jawaban = '';
        render();
      });
    }

    const modalSoalMapel = document.getElementById('modal-soal-mapel');
    if (modalSoalMapel) {
      modalSoalMapel.addEventListener('change', (e) => {
        syncSoalDraftFromForm();
        state.modalSoalDraft.mapel_id = e.target.value;
        state.modalSoalSelectedKelas = new Set(getAuthorizedKelasList(e.target.value));
        render();
      });
    }

    const btnAddPasanganRow = document.getElementById('btn-add-pasangan-row');
    if (btnAddPasanganRow) {
      btnAddPasanganRow.addEventListener('click', () => {
        syncSoalDraftFromForm();
        state.modalSoalDraft.pasangan.push({ kiri: '', kanan: '' });
        render();
      });
    }

    document.querySelectorAll('[data-del-pasangan-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        syncSoalDraftFromForm();
        const idx = Number(btn.getAttribute('data-del-pasangan-idx'));
        state.modalSoalDraft.pasangan.splice(idx, 1);
        render();
      });
    });

    const inputSoalGambar = document.getElementById('input-soal-gambar');
    if (inputSoalGambar) {
      inputSoalGambar.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        syncSoalDraftFromForm();
        state.modalSoalImagePreview = await compressImageToDataUrl(file, 720, 0.85);
        render();
      });
    }

    const btnClearSoalImg = document.getElementById('btn-clear-soal-img');
    if (btnClearSoalImg) {
      btnClearSoalImg.addEventListener('click', () => {
        syncSoalDraftFromForm();
        state.modalSoalImagePreview = '';
        if (state.modal?.data) state.modal.data.gambar_url = '';
        render();
      });
    }

    const formSaveSoal = document.getElementById('form-save-soal');
    if (formSaveSoal) {
      formSaveSoal.addEventListener('submit', async (e) => {
        e.preventDefault();
        syncSoalDraftFromForm();
        const d = state.modalSoalDraft;
        const tipe = normalizeTipeSoal(d.tipe_soal);
        const kelasTargetStr = [...state.modalSoalSelectedKelas].join(', ');
        const payload = {
          mapel_id: d.mapel_id,
          kelas_target: kelasTargetStr,
          nomor_urut: d.nomor_urut,
          tipe_soal: tipe,
          pertanyaan: d.pertanyaan,
          gambar_url: state.modalSoalImagePreview || '',
          opsi_a: tipe === 'PILIHAN GANDA' || tipe === 'PILIHAN GANDA KOMPLEKS' ? d.opsi_a : '',
          opsi_b: tipe === 'PILIHAN GANDA' || tipe === 'PILIHAN GANDA KOMPLEKS' ? d.opsi_b : '',
          opsi_c: tipe === 'PILIHAN GANDA' || tipe === 'PILIHAN GANDA KOMPLEKS' ? d.opsi_c : '',
          opsi_d: tipe === 'PILIHAN GANDA' || tipe === 'PILIHAN GANDA KOMPLEKS' ? d.opsi_d : '',
          pasangan_json: tipe === 'MENJODOHKAN' ? d.pasangan : [],
          kunci_jawaban: tipe === 'MENJODOHKAN' ? 'SESUAI PASANGAN' : d.kunci_jawaban,
          bobot: d.bobot,
          tingkat: 'Sedang',
          topik: d.topik || 'Umum',
          pembahasan: ''
        };

        try {
          if (state.modal?.data?.id) {
            await dbUpdate('bank_soal', state.modal.data.id, payload);
            showToast('Butir soal berhasil diperbarui!');
          } else {
            await dbInsert('bank_soal', payload);
            showToast('Butir soal baru berhasil ditambahkan!');
          }
          state.filterSoalMapel = payload.mapel_id;
          state.modal = null;
          state.modalSoalDraft = null;
          render();
        } catch (err) {
          showToast('Gagal menyimpan soal: ' + err.message, 'error');
        }
      });
    }

    // Jadwal Ujian Events
    const btnOpenAddJadwal = document.getElementById('btn-open-add-jadwal');
    if (btnOpenAddJadwal) {
      btnOpenAddJadwal.addEventListener('click', () => {
        const authMapels = getAuthorizedMapels();
        if (authMapels.length === 0) {
          showToast('Tambahkan mata pelajaran terlebih dahulu.', 'error');
          return;
        }
        const mId = authMapels[0].id;
        state.modalJadwalMapelId = mId;
        state.modalJadwalKelasInitialized = false;
        const defaultSoals = state.db.bank_soal.filter(s => s.mapel_id === mId).map(s => s.id);
        state.modalJadwalSelectedSoal = new Set(defaultSoals);
        state.modal = { type: 'jadwal', data: null };
        render();
      });
    }

    document.querySelectorAll('[data-edit-jadwal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-jadwal');
        const jd = state.db.jadwal_ujian.find(x => x.id === id);
        if (!jd) return;
        state.modalJadwalMapelId = jd.mapel_id;
        state.modalJadwalKelasInitialized = false;
        state.modalJadwalSelectedSoal = new Set(Array.isArray(jd.soal_ids_json) ? jd.soal_ids_json : []);
        state.modal = { type: 'jadwal', data: jd };
        render();
      });
    });

    document.querySelectorAll('[data-del-jadwal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-del-jadwal');
        openConfirmDialog({
          title: 'Hapus Jadwal Ujian',
          message: 'Yakin ingin menghapus jadwal ujian ini?',
          confirmLabel: 'Ya, Hapus',
          variant: 'danger',
          onConfirm: async () => {
            await dbDeleteMany('jadwal_ujian', [id]);
            showToast('Jadwal ujian berhasil dihapus.');
            render();
          }
        });
      });
    });

    document.querySelectorAll('[data-toggle-jadwal-status]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-toggle-jadwal-status');
        const jd = state.db.jadwal_ujian.find(x => x.id === id);
        if (!jd) return;
        const nextStatus = getEffectiveJadwalStatus(jd) === 'Aktif' ? 'Selesai' : 'Aktif';

    document.querySelectorAll('[data-inline-isian-sesi]').forEach(inp => {
      const handleInlineIsianUpdate = async (shouldSave) => {
        const sesiId = inp.getAttribute('data-inline-isian-sesi');
        const sesi = state.db.sesi_ujian_siswa.find(s => String(s.id) === String(sesiId));
        if (!sesi) return;

        const jd = state.db.jadwal_ujian.find(j => String(j.id) === String(sesi.jadwal_id)) || {};
        const jadwalSoals = getExamSoalListForJadwal(jd);

        let rawVal = parseFloat(String(inp.value).replace(',', '.'));
        if (Number.isNaN(rawVal)) rawVal = 0;
        const clampedScore = Math.max(0, Math.min(100, rawVal));
        if (shouldSave) {
          inp.value = clampedScore;
        }

        const { objScore, finalScore, isianContribution } = jadwalSoals.length > 0
          ? calculateObjectiveScore(jadwalSoals, sesi.jawaban_json || {}, clampedScore)
          : {
              objScore: getObjScore(sesi),
              finalScore: Math.min(100, Math.round((getObjScore(sesi) + clampedScore) * 10) / 10),
              isianContribution: clampedScore
            };

        const contribEl = document.getElementById(`isian-contrib-${sesiId}`);
        if (contribEl) contribEl.textContent = `(+${isianContribution})`;
        const akhirEl = document.getElementById(`nilai-akhir-cell-${sesiId}`);
        if (akhirEl) akhirEl.textContent = `${finalScore}`;

        if (shouldSave) {
          sesi.skor_pg = objScore;
          sesi.skor_essay = clampedScore;
          sesi.nilai_akhir = finalScore;
          try {
            await dbUpdate('sesi_ujian_siswa', sesi.id, {
              skor_pg: objScore,
              skor_essay: clampedScore,
              nilai_akhir: finalScore
            });
            showToast(`Skor Isian Singkat (${clampedScore}) & Nilai Akhir (${finalScore}) tersimpan.`);
          } catch (err) {
            try {
              await dbUpdate('sesi_ujian_siswa', sesi.id, {
                skor_essay: clampedScore,
                nilai_akhir: finalScore
              });
              showToast(`Skor Isian Singkat (${clampedScore}) & Nilai Akhir (${finalScore}) tersimpan.`);
            } catch (err2) {
              showToast('Gagal menyimpan perubahan skor: ' + (err2?.message || err2), 'error');
            }
          }
        }
      };

      inp.addEventListener('input', () => handleInlineIsianUpdate(false));
      inp.addEventListener('change', () => handleInlineIsianUpdate(true));
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {

        }
      });
    });

          catatan: String(fd.get('catatan') || '').trim()
        };
        state.editingBeritaAcara = false;
        showToast('Isi Berita Acara berhasil diperbarui!');
        render();
      });
    }

    const btnPrintDoc = document.getElementById('btn-print-doc');
    if (btnPrintDoc) {
      btnPrintDoc.addEventListener('click', () => printAdminDocumentA4());
    }

    // Pengaturan Sekolah & Upload Logo
    const handleLogoUpload = (inputId, keyName, label) => {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      inp.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const dataUrl = await compressImageToDataUrl(file, 320, 0.85);
        state.modalLogos[keyName] = dataUrl;
        showToast(`${label} siap! Klik Simpan Pengaturan Sekolah untuk menyimpan permanen.`);
        render();
      });
    };
    handleLogoUpload('input-logo-dinas', 'dinas', 'Logo Dinas');
    handleLogoUpload('input-logo-sekolah', 'sekolah', 'Logo Sekolah');
    handleLogoUpload('input-logo-aplikasi', 'aplikasi', 'Logo Aplikasi');

    document.querySelectorAll('[data-clear-logo]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-clear-logo');
        state.modalLogos[key] = '';
        render();
      });
    });

    const formSaveSettings = document.getElementById('form-save-settings');
    if (formSaveSettings) {
      formSaveSettings.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(formSaveSettings);
        const cur = getSchoolConfig();
        const payload = {
          nama_sekolah: String(fd.get('nama_sekolah') || '').trim(),
          npsn: String(fd.get('npsn') || '').trim(),
          alamat: String(fd.get('alamat') || '').trim(),
          tahun_pelajaran: String(fd.get('tahun_pelajaran') || '').trim(),
          semester: String(fd.get('semester') || 'Ganjil').trim(),
          nama_kepsek: String(fd.get('nama_kepsek') || '').trim(),
          nip_kepsek: String(fd.get('nip_kepsek') || '').trim(),
          nama_proktor: String(fd.get('nama_proktor') || '').trim(),
          nip_proktor: String(fd.get('nip_proktor') || '').trim(),
          nama_pengawas: String(fd.get('nama_pengawas') || '').trim(),
          nip_pengawas: String(fd.get('nip_pengawas') || '').trim(),
          max_pelanggaran: Math.max(1, Number(fd.get('max_pelanggaran')) || 3),
          logo_dinas_url: state.modalLogos.dinas !== undefined ? state.modalLogos.dinas : (cur.logo_dinas_url || ''),
          logo_sekolah_url: state.modalLogos.sekolah !== undefined ? state.modalLogos.sekolah : (cur.logo_sekolah_url || ''),
          logo_aplikasi_url: state.modalLogos.aplikasi !== undefined ? state.modalLogos.aplikasi : (cur.logo_aplikasi_url || '')
        };
        try {
          await saveSchoolConfigRecord(payload);
          state.modalLogos = { dinas: undefined, sekolah: undefined, aplikasi: undefined };
          showToast('Pengaturan identitas sekolah & logo berhasil disimpan!');
          render();
        } catch (err) {
          showToast('Gagal menyimpan pengaturan: ' + err.message, 'error');
        }
      });
    }

    // Siswa Masuk Ujian & Ruang Ujian
    document.querySelectorAll('[data-open-token-modal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const jd = state.db.jadwal_ujian.find(x => String(x.id) === String(btn.getAttribute('data-open-token-modal')));
        if (jd) {
          state.modal = { type: 'token_exam', data: jd };
          render();
        }
      });
    });

    const formEnterExamToken = document.getElementById('form-enter-exam-token');
    if (formEnterExamToken) {
      formEnterExamToken.addEventListener('submit', async (e) => {
        e.preventDefault();
        const tok = document.getElementById('input-student-token')?.value || '';
        await startStudentExam(state.modal.data, tok);
      });
    }

    // Ruang Ujian Aktif (Jawaban, Navigasi, Font Size, Ragu-Ragu, Selesai)
    if (state.exam.active) {
      const soal = state.exam.soalList[state.exam.currentIndex];

      document.querySelectorAll('[data-exam-font]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.exam.fontSize = btn.getAttribute('data-exam-font');
          render();
        });
      });

      document.querySelectorAll('[data-answer-pg]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const val = btn.getAttribute('data-answer-pg');
          await saveStudentAnswer(soal.id, val);
          render();
        });
      });

      document.querySelectorAll('[data-toggle-pgk]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const val = btn.getAttribute('data-toggle-pgk');
          const cur = normalizePgkAnswerArray(state.exam.jawaban[soal.id]);
          const next = cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val];
          await saveStudentAnswer(soal.id, next);
          render();
        });
      });

      document.querySelectorAll('[data-match-idx]').forEach(sel => {
        sel.addEventListener('change', async () => {
          const idx = sel.getAttribute('data-match-idx');
          const curObj = normalizeMatchAnswerObj(state.exam.jawaban[soal.id]);
          curObj[idx] = sel.value;
          await saveStudentAnswer(soal.id, curObj);
          render();
        });
      });

      const inputExamShort = document.getElementById('input-exam-short');
      if (inputExamShort) {
        inputExamShort.addEventListener('input', (e) => {
          state.exam.jawaban[soal.id] = e.target.value;
        });
        inputExamShort.addEventListener('blur', async (e) => {
          await saveStudentAnswer(soal.id, e.target.value);
        });
      }

      const inputExamEssay = document.getElementById('input-exam-essay');
      if (inputExamEssay) {
        inputExamEssay.addEventListener('input', (e) => {
          state.exam.jawaban[soal.id] = e.target.value;
          const cnt = document.getElementById('exam-essay-counter');
          if (cnt) cnt.textContent = `${e.target.value.length} karakter`;
        });
        inputExamEssay.addEventListener('blur', async (e) => {
          await saveStudentAnswer(soal.id, e.target.value);
        });
      }

      const btnPrevSoal = document.getElementById('btn-prev-soal');
      if (btnPrevSoal) {
        btnPrevSoal.addEventListener('click', () => {
          if (state.exam.currentIndex > 0) {
            state.exam.currentIndex -= 1;
            render();
          }
        });
      }

      const btnNextSoal = document.getElementById('btn-next-soal');
      if (btnNextSoal) {
        btnNextSoal.addEventListener('click', () => {
          if (state.exam.currentIndex < state.exam.soalList.length - 1) {
            state.exam.currentIndex += 1;
            render();
          }
        });
      }

      const btnToggleRagu = document.getElementById('btn-toggle-ragu');
      if (btnToggleRagu) {
        btnToggleRagu.addEventListener('click', async () => {
          state.exam.ragu[soal.id] = !state.exam.ragu[soal.id];
          if (state.exam.sesiRecord) {
            await dbUpdate('sesi_ujian_siswa', state.exam.sesiRecord.id, { ragu_json: { ...state.exam.ragu } });
          }
          render();
        });
      }

      const btnToggleNavSoal = document.getElementById('btn-toggle-nav-soal');
      if (btnToggleNavSoal) {
        btnToggleNavSoal.addEventListener('click', () => {
          state.exam.showDaftarSoalMobile = !state.exam.showDaftarSoalMobile;
          render();
        });
      }

      document.querySelectorAll('[data-jump-soal]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.exam.currentIndex = Number(btn.getAttribute('data-jump-soal')) || 0;
          state.exam.showDaftarSoalMobile = false;
          render();
        });
      });

      const handleFinishClick = () => {
        const unanswered = state.exam.soalList.filter(s => !isSoalAnswered(s, state.exam.jawaban[s.id])).length;
        openConfirmDialog({
          title: 'Konfirmasi Selesai Ujian',
          message: unanswered > 0
            ? `Masih ada ${unanswered} soal yang belum terjawab. Yakin ingin mengakhiri ujian dan mengumpulkan jawaban sekarang?`
            : 'Semua soal telah dijawab. Yakin ingin mengumpulkan ujian sekarang?',
          confirmLabel: 'Ya, Kumpulkan Jawaban',
          variant: 'primary',
          onConfirm: async () => await finishStudentExam(false)
        });
      };

      const btnFinishExam = document.getElementById('btn-finish-exam');
      if (btnFinishExam) btnFinishExam.addEventListener('click', handleFinishClick);
      const btnFinishExamSide = document.getElementById('btn-finish-exam-side');
      if (btnFinishExamSide) btnFinishExamSide.addEventListener('click', handleFinishClick);
    }
  }

  // =========================================================================
  // INISIALISASI GLOBAL & TOMBOL TIRAI KEAMANAN
  // =========================================================================
  const btnDismissCurtain = document.getElementById('btn-dismiss-curtain');
  if (btnDismissCurtain) {
    btnDismissCurtain.addEventListener('click', () => {
      if (state.exam.locked) return;
      state.exam.graceUntil = Date.now() + 4000;
      const curtain = document.getElementById('security-curtain');
      if (curtain) curtain.style.display = 'none';
      safeRequestFullscreen();
    });
  }

  const btnCheckUnlock = document.getElementById('btn-check-unlock');
  if (btnCheckUnlock) {
    btnCheckUnlock.addEventListener('click', async () => {
      await syncFastOperationalData(false);
      const latest = state.db.sesi_ujian_siswa.find(s => s.id === state.exam.sesiRecord?.id);
      if (latest && latest.status !== 'terkunci') {
        handleRemoteSessionUnlocked(latest);
      } else {
        showToast('Sesi masih terkunci oleh pengawas.', 'error');
      }
    });
  }

  setInterval(() => {
    const clockEl = document.getElementById('live-clock-wita');
    if (clockEl) clockEl.textContent = getWitaTimeString();
  }, 1000);

  setInterval(() => {
    if (!IS_PREVIEW && supabase && state.currentUser) {
      syncFastOperationalData(false);
    }
  }, 5000);

  (async function bootstrapApp() {
    setupRealtimeSync();
    if (!IS_PREVIEW && supabase) {
      await loadAllData();
    }
    render();
  })();
</script>
</body>
</html>
