  function parseKelasString(str) {
    return (str || '')
      .split(',')
      .map(k => k.trim())
      .filter(k => k && k !== '-');
  }

  function getAuthorizedMapels() {
    if (!state.currentUser) return [];
    if (state.currentUser.role === 'guru') {
      return state.db.mata_pelajaran.filter(m => m.guru_id === state.currentUser.id);
    }
    return state.db.mata_pelajaran;
  }

  function getAuthorizedMapelIds() {
    return new Set(getAuthorizedMapels().map(m => m.id));
  }

  function getAllMasterClasses() {
    const classSet = new Set();
    state.db.users_cbt
      .filter(u => u.role === 'siswa' && u.kelas && u.kelas !== '-')
      .forEach(u => classSet.add(u.kelas.trim()));
    state.db.mata_pelajaran.forEach(m => {
      parseKelasString(m.kelas_ampu).forEach(k => classSet.add(k));
    });
    return [...classSet].sort();
  }

  function getAuthorizedKelasList(specificMapelId = '') {
    const allMaster = getAllMasterClasses();
    if (specificMapelId) {
      const mp = state.db.mata_pelajaran.find(m => m.id === specificMapelId);
      const mpClasses = parseKelasString(mp?.kelas_ampu);
      if (mpClasses.length > 0) {
        return [...new Set([...mpClasses, ...allMaster])].sort();
      }
    }

    if (state.currentUser?.role === 'guru') {
      const authMapels = getAuthorizedMapels();
      const guruClassSet = new Set();
      authMapels.forEach(m => {
        parseKelasString(m.kelas_ampu).forEach(k => guruClassSet.add(k));
      });
      if (guruClassSet.size > 0) {
        return [...guruClassSet].sort();
      }
    }

    return allMaster;
  }

  function playWarningBeep() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } catch (e) {}
  }

  function setAntiTranslate(enable) {
    const htmlEl = document.documentElement;
    let meta = document.querySelector('meta[name="google"]');
    if (enable) {
      htmlEl.setAttribute('translate', 'no');
      htmlEl.classList.add('notranslate');
      if (!meta) {
        meta = document.createElement('meta');
        meta.name = 'google';
        meta.content = 'notranslate';
        document.head.appendChild(meta);
      }
    } else {
      htmlEl.removeAttribute('translate');
      htmlEl.classList.remove('notranslate');
      if (meta) meta.remove();
    }
  }

  async function loadAllData() {
    if (IS_PREVIEW) return;
    if (!supabase) {
      showToast('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi!', 'error');
      return;
    }
    state.loading = true;
    render();
    try {
      const [cfgRes, usersRes, mapelRes, soalRes, jadwalRes, sesiRes] = await Promise.all([
        supabase.from('pengaturan_sekolah').select('*').limit(1),
        supabase.from('users_cbt').select('*').order('nama_lengkap', { ascending: true }),
        supabase.from('mata_pelajaran').select('*').order('nama_mapel', { ascending: true }),
        supabase.from('bank_soal').select('*').order('nomor_urut', { ascending: true }),
        supabase.from('jadwal_ujian').select('*').order('created_at', { ascending: false }),
        supabase.from('sesi_ujian_siswa').select('*').order('waktu_mulai', { ascending: false })
      ]);

      if (cfgRes.error) throw cfgRes.error;
      if (usersRes.error) throw usersRes.error;
      if (mapelRes.error) throw mapelRes.error;
      if (soalRes.error) throw soalRes.error;
      if (jadwalRes.error) throw jadwalRes.error;
      if (sesiRes.error) throw sesiRes.error;

      if (cfgRes.data) state.db.pengaturan_sekolah = cfgRes.data;
      if (usersRes.data) state.db.users_cbt = usersRes.data;
      if (mapelRes.data) state.db.mata_pelajaran = mapelRes.data;
      if (soalRes.data) state.db.bank_soal = soalRes.data;
      if (jadwalRes.data) state.db.jadwal_ujian = jadwalRes.data;
      if (sesiRes.data) state.db.sesi_ujian_siswa = sesiRes.data;
    } catch (err) {
      showToast('Gagal memuat data dari Supabase: ' + (err.message || err), 'error');
    } finally {
      state.loading = false;
      render();
    }
  }

  async function dbInsert(table, payload) {
    const items = Array.isArray(payload) ? payload : [payload];
    if (IS_PREVIEW) {
      const inserted = items.map((item, idx) => ({
        ...item,
        id: item.id || `${table}-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
        created_at: new Date().toISOString()
      }));
      state.db[table] = [...inserted, ...(state.db[table] || [])];
      return inserted;
    }
    if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
    const { data, error } = await supabase.from(table).insert(items).select();
    if (error) throw error;
    state.db[table] = [...(data || []), ...(state.db[table] || [])];
    return data || [];
  }

  async function dbUpdate(table, id, payload) {
    if (IS_PREVIEW) {
      state.db[table] = (state.db[table] || []).map(row => row.id === id ? { ...row, ...payload } : row);
      return state.db[table].find(row => row.id === id);
    }
    if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
    const { data, error } = await supabase.from(table).update(payload).eq('id', id).select();
    if (error) throw error;
    const updatedRow = data?.[0];
    state.db[table] = (state.db[table] || []).map(row => row.id === id ? (updatedRow || { ...row, ...payload }) : row);
    return updatedRow || state.db[table].find(row => row.id === id);
  }

  async function dbDeleteMany(table, ids) {
    if (!ids || ids.length === 0) return;
    if (IS_PREVIEW) {
      const idSet = new Set(ids);
      state.db[table] = (state.db[table] || []).filter(row => !idSet.has(row.id));
      if (table === 'jadwal_ujian') {
        state.db.sesi_ujian_siswa = (state.db.sesi_ujian_siswa || []).filter(s => !idSet.has(s.jadwal_id));
      } else if (table === 'mata_pelajaran') {
        const deletedJadwalIds = new Set(
          (state.db.jadwal_ujian || []).filter(j => idSet.has(j.mapel_id)).map(j => j.id)
        );
        state.db.bank_soal = (state.db.bank_soal || []).filter(s => !idSet.has(s.mapel_id));
        state.db.jadwal_ujian = (state.db.jadwal_ujian || []).filter(j => !idSet.has(j.mapel_id));
        state.db.sesi_ujian_siswa = (state.db.sesi_ujian_siswa || []).filter(s => !deletedJadwalIds.has(s.jadwal_id));
      }
      return;
    }
    if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
    const { error } = await supabase.from(table).delete().in('id', ids);
    if (error) throw error;
    const idSet = new Set(ids);
    state.db[table] = (state.db[table] || []).filter(row => !idSet.has(row.id));
  }

  // =========================================================================
  async function handleLogin(usernameInput, passwordInput) {
    const u = (usernameInput || '').trim();
    const p = (passwordInput || '').trim();
    if (!u || !p) {
      showToast('Username dan kata sandi wajib diisi!', 'error');
      return;
    }

    state.loading = true;
    render();

    try {
      const isAdminAttempt = u.toLowerCase() === 'admin' || u.toLowerCase() === ADMIN_AUTH_EMAIL.toLowerCase();

      if (IS_PREVIEW) {
        if (isAdminAttempt) {
          if (p !== 'admincbt') {
            throw new Error('Password Admin salah! (Default: admin / admincbt)');
          }
          state.currentUser = {
            id: 'admin-preview',
            username: 'admin',
            nama_lengkap: 'Administrator CBT Utama',
            role: 'admin'
          };
          state.activeMenu = 'dashboard';
          state.sidebarOpen = window.innerWidth >= 1024;
          showToast('Berhasil masuk sebagai Administrator (Mode Preview)');
          return;
        }

        const matchedUser = state.db.users_cbt.find(
          usr => (usr.username === u || usr.nip_nisn === u) && usr.password === p
        );
        if (!matchedUser) {
          throw new Error('Username / NISN / NIP atau Kata Sandi tidak ditemukan!');
        }
        if (matchedUser.role === 'siswa' && matchedUser.is_logged_in) {
          throw new Error('Akun sedang aktif di perangkat lain! Hubungi Proktor/Admin untuk Reset Login.');
        }

        if (matchedUser.role === 'siswa') {
          await dbUpdate('users_cbt', matchedUser.id, { is_logged_in: true });
        }

        state.currentUser = { ...matchedUser };
        state.activeMenu = matchedUser.role === 'guru' ? 'dashboard' : 'jadwal_siswa';
        state.sidebarOpen = window.innerWidth >= 1024;
        showToast(`Selamat datang, ${matchedUser.nama_lengkap}!`);
        return;
      }

      if (!supabase) {
        throw new Error('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi!');
      }

      if (isAdminAttempt) {
        const emailToUse = u.includes('@') ? u : ADMIN_AUTH_EMAIL;
        const { data, error } = await supabase.auth.signInWithPassword({
          email: emailToUse,
          password: p
        });
        if (error) {
          throw new Error('Login Admin gagal: ' + error.message);
        }
        state.currentUser = {
          id: data.user.id,
          username: 'admin',
          nama_lengkap: 'Administrator CBT Utama',
          role: 'admin',
          email: data.user.email
        };
        state.activeMenu = 'dashboard';
        state.sidebarOpen = window.innerWidth >= 1024;
        await loadAllData();
        showToast('Berhasil masuk sebagai Administrator!');
        return;
      }

      const { data: userRows, error: userErr } = await supabase
        .from('users_cbt')
        .select('*')
        .or(`username.eq.${u},nip_nisn.eq.${u}`)
        .eq('password', p)
        .limit(1);

      if (userErr) throw userErr;
      const matchedUser = userRows?.[0];
      if (!matchedUser) {
        throw new Error('Username / NISN / NIP atau Kata Sandi salah!');
      }
      if (matchedUser.role === 'siswa' && matchedUser.is_logged_in) {
        throw new Error('Akun sedang aktif di perangkat lain! Hubungi Pengawas/Proktor untuk Reset Login.');
      }

      if (matchedUser.role === 'siswa') {
        await supabase.from('users_cbt').update({ is_logged_in: true }).eq('id', matchedUser.id);
      }

      state.currentUser = { ...matchedUser };
      state.activeMenu = matchedUser.role === 'guru' ? 'dashboard' : 'jadwal_siswa';
      state.sidebarOpen = window.innerWidth >= 1024;
      await loadAllData();
      showToast(`Selamat datang, ${matchedUser.nama_lengkap}!`);
    } catch (err) {
      showToast(err.message || 'Gagal melakukan autentikasi', 'error');
    } finally {
      state.loading = false;
      render();
    }
  }

  function safeRequestFullscreen() {
    try {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    } catch (e) {}
  }

  async function requestScreenWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        state.exam.wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }

  function releaseScreenWakeLock() {
    try {
      if (state.exam.wakeLock) {
        state.exam.wakeLock.release().catch(() => {});
        state.exam.wakeLock = null;
      }
    } catch (e) {}
  }

  function showLockedCurtain(reason, count, maxAllowed) {
    if (!state.exam.active || state.exam.isSubmitting) return;
    const curtain = document.getElementById('security-curtain');
    const titleEl = document.getElementById('curtain-title');
    const reasonEl = document.getElementById('curtain-reason');
    const counterEl = document.getElementById('curtain-counter');
    const dismissBtn = document.getElementById('btn-dismiss-curtain');
    const unlockBtn = document.getElementById('btn-check-unlock');

    if (curtain) {
      curtain.style.display = 'flex';
      if (titleEl) titleEl.textContent = '🔒 UJIAN ANDA TERKUNCI OTOMATIS';
      if (reasonEl) {
        reasonEl.textContent = `Anda telah mencapai batas maksimal pelanggaran (${count}/${maxAllowed} pelanggaran: ${reason}). Ruang ujian dikunci. Silakan lapor ke Pengawas / Guru Mapel untuk membuka kunci ujian Anda.`;
      }
      if (counterEl) counterEl.textContent = `Status: TERKUNCI (${count}/${maxAllowed} Pelanggaran)`;
      if (dismissBtn) dismissBtn.classList.add('hidden');
      if (unlockBtn) unlockBtn.classList.remove('hidden');
    }
  }

  let lastViolationTimestamp = 0;
  async function recordViolation(reason) {
    // Jangan pernah mencatat pelanggaran jika ujian sudah tidak aktif, terkunci, sedang dikumpulkan/selesai, atau dalam jeda transisi
    if (!state.exam.active || state.exam.locked || state.exam.isSubmitting || state.exam.finishedHandled) return;
    if (Date.now() < (state.exam.graceUntil || 0)) return;

    const now = Date.now();
    if (now - lastViolationTimestamp < 1200) return;
    lastViolationTimestamp = now;

    playWarningBeep();

    const cfg = getSchoolConfig();
    const maxAllowed = Number(cfg.max_pelanggaran) || 3;
    const sesi = state.exam.sesiRecord;
    const prevCount = sesi ? (Number(sesi.jumlah_pelanggaran) || 0) : 0;
    const newCount = prevCount + 1;
    const newLogs = [
      ...(Array.isArray(sesi?.log_pelanggaran) ? sesi.log_pelanggaran : []),
      { waktu: getWitaTimeString(), alasan: reason }
    ];

    const shouldLock = newCount >= maxAllowed;

    if (sesi) {
      if (sesi.status === 'selesai' || state.exam.isSubmitting) return;
      sesi.jumlah_pelanggaran = newCount;
      sesi.log_pelanggaran = newLogs;
      if (shouldLock) sesi.status = 'terkunci';
      try {
        await dbUpdate('sesi_ujian_siswa', sesi.id, {
          jumlah_pelanggaran: newCount,
          log_pelanggaran: newLogs,
          status: shouldLock ? 'terkunci' : 'mengerjakan'
        });
      } catch (e) {}
    }

    if (!state.exam.active || state.exam.isSubmitting) return;

    if (shouldLock) {
      state.exam.locked = true;
      showLockedCurtain(reason, newCount, maxAllowed);
      return;
    }

    const curtain = document.getElementById('security-curtain');
    const titleEl = document.getElementById('curtain-title');
    const reasonEl = document.getElementById('curtain-reason');
    const counterEl = document.getElementById('curtain-counter');
    const dismissBtn = document.getElementById('btn-dismiss-curtain');
    const unlockBtn = document.getElementById('btn-check-unlock');

    if (curtain) {
      curtain.style.display = 'flex';
      if (titleEl) titleEl.textContent = 'PELANGGARAN KEAMANAN TERDETEKSI';
      if (reasonEl) {
        reasonEl.textContent = `Terdeteksi aktivitas terlarang: "${reason}". Pelanggaran telah dicatat ke server pengawas. Jika mencapai ${maxAllowed}x pelanggaran, ujian akan terkunci otomatis!`;
      }
      if (counterEl) counterEl.textContent = `Pelanggaran ke-${newCount} dari maksimal ${maxAllowed}`;
      if (dismissBtn) dismissBtn.classList.remove('hidden');
      if (unlockBtn) unlockBtn.classList.add('hidden');
    }
  }

  async function checkUnlockStatus() {
    if (!state.exam.active || !state.exam.sesiRecord) return;
    try {
      let currentSesi = state.exam.sesiRecord;
      if (!IS_PREVIEW && supabase) {
        const { data, error } = await supabase
          .from('sesi_ujian_siswa')
          .select('*')
          .eq('id', currentSesi.id)
          .maybeSingle();
        if (error) throw error;
        if (data) currentSesi = data;
      } else {
        currentSesi = state.db.sesi_ujian_siswa.find(s => s.id === currentSesi.id) || currentSesi;
      }

      if (currentSesi.status !== 'terkunci') {
        state.exam.sesiRecord = currentSesi;
        state.exam.locked = false;
        state.exam.graceUntil = Date.now() + 2000;
        const curtain = document.getElementById('security-curtain');
        if (curtain) curtain.style.display = 'none';
        safeRequestFullscreen();
        await requestScreenWakeLock();
        showToast('Kunci ujian telah dibuka oleh Pengawas/Guru! Silakan lanjutkan ujian.');
        render();
      } else {
        showToast('Ujian masih terkunci. Minta Admin/Guru menekan tombol "Buka Kunci" di Monitoring Live.', 'error');
      }
    } catch (err) {
      showToast('Gagal memeriksa status kunci: ' + (err.message || err), 'error');
    }
  }

  function setupAntiCheatListeners() {
    document.getElementById('btn-dismiss-curtain')?.addEventListener('click', () => {
      if (state.exam.locked) return;
      state.exam.graceUntil = Date.now() + 1800;
      const curtain = document.getElementById('security-curtain');
      if (curtain) curtain.style.display = 'none';
      safeRequestFullscreen();
      requestScreenWakeLock();
    });

    document.getElementById('btn-check-unlock')?.addEventListener('click', checkUnlockStatus);

    document.addEventListener('visibilitychange', () => {
      if (!state.exam.active || state.exam.isSubmitting) return;
      if (document.hidden) {
        recordViolation('Keluar dari halaman / berpindah tab ujian');
      } else if (!state.exam.locked) {
        requestScreenWakeLock();
      }
    });

    window.addEventListener('blur', () => {
      if (!state.exam.active || state.exam.isSubmitting) return;
      // Jangan anggap blur jika dialog konfirmasi Selesai sedang terbuka
      if (state.confirmDialog) return;
      recordViolation('Membuka aplikasi lain / kehilangan fokus layar ujian');
    });

    document.addEventListener('fullscreenchange', () => {
      if (!state.exam.active || state.exam.locked || state.exam.isSubmitting) return;
      if (!document.fullscreenElement) {
        recordViolation('Keluar dari mode layar penuh (Fullscreen)');
      }
    });

    document.addEventListener('touchstart', (e) => {
      if (!state.exam.active || state.exam.isSubmitting) return;
      if (e.touches && e.touches.length >= 3) {
        if (e.cancelable) e.preventDefault();
        recordViolation('Gestur Screenshot 3 Jari terdeteksi');
      }
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      if (!state.exam.active || state.exam.isSubmitting) return;
      if (e.touches && e.touches.length >= 3) {
        if (e.cancelable) e.preventDefault();
        recordViolation('Gestur Geser 3 Jari (Screenshot) terdeteksi');
      }
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (!state.exam.active || state.exam.isSubmitting) return;
      const key = e.key || '';
      const isVolumeOrPower = ['AudioVolumeDown', 'AudioVolumeUp', 'VolumeDown', 'VolumeUp', 'Power'].includes(key);
      const isPrintScreen = key === 'PrintScreen' || e.code === 'PrintScreen';
      const isShortcutCheat = (e.ctrlKey || e.metaKey) && ['p', 's', 'u', 'c', 'x'].includes(key.toLowerCase());
      const isSnippingTool = (e.metaKey || e.ctrlKey) && e.shiftKey && key.toLowerCase() === 's';
      const isDevTools = key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i', 'j', 'c'].includes(key.toLowerCase()));

      if (isVolumeOrPower || isPrintScreen || isShortcutCheat || isSnippingTool || isDevTools) {
        e.preventDefault();
        e.stopPropagation();
        if (isVolumeOrPower) {
          recordViolation('Menekan tombol Volume / Power (Indikasi Screenshot HP)');
        } else if (isPrintScreen || isSnippingTool) {
          recordViolation('Percobaan Screenshot layar (PrintScreen / Snipping)');
        } else {
          recordViolation(`Pintasan terlarang (${key}) diblokir`);
        }
      }
    }, true);

    window.addEventListener('keyup', (e) => {
      if (!state.exam.active || state.exam.isSubmitting) return;
      if (e.key === 'PrintScreen' || e.code === 'PrintScreen') {
        recordViolation('Tombol PrintScreen terdeteksi');
      }
    }, true);

    document.addEventListener('contextmenu', (e) => {
      if (state.exam.active) e.preventDefault();
    });
    ['copy', 'cut', 'paste'].forEach(evt => {
      document.addEventListener(evt, (e) => {
        if (state.exam.active) e.preventDefault();
      });
    });
  }

  // =========================================================================
  // MEMULAI & MENYELESAIKAN SESI UJIAN SISWA
  // =========================================================================
  async function startStudentExam(jadwalId, tokenInput) {
    const jadwal = state.db.jadwal_ujian.find(j => j.id === jadwalId);
    if (!jadwal) {
      showToast('Jadwal ujian tidak ditemukan.', 'error');
      return;
    }

    const inputClean = (tokenInput || '').trim().toUpperCase();
    const validToken = (jadwal.token_ujian || '').trim().toUpperCase();
    if (inputClean !== validToken) {
      showToast('Token ujian salah! Periksa kembali token dari pengawas.', 'error');
      return;
    }

    const mapel = state.db.mata_pelajaran.find(m => m.id === jadwal.mapel_id);
    const siswaKelas = (state.currentUser.kelas || '').trim().toLowerCase();
    const checkedIds = Array.isArray(jadwal.soal_ids_json) ? jadwal.soal_ids_json : [];

    let soalList = state.db.bank_soal
      .filter(s => {
        if (s.mapel_id !== jadwal.mapel_id) return false;
        if (checkedIds.length > 0) {
          return checkedIds.includes(s.id);
        }
        if (s.kelas_target && s.kelas_target.trim() !== '') {
          const targets = s.kelas_target.toLowerCase().split(',').map(x => x.trim());
          return targets.includes('semua') || targets.includes(siswaKelas);
        }
        return true;
      })
      .sort((a, b) => (a.nomor_urut || 0) - (b.nomor_urut || 0));

    if (soalList.length === 0) {
      showToast('Belum ada butir soal pada mata pelajaran / jadwal ujian ini.', 'error');
      return;
    }

    if (jadwal.acak_soal) {
      soalList = [...soalList].sort(() => Math.random() - 0.5);
    }

    const limitSoal = Number(jadwal.jumlah_soal) || 0;
    if (limitSoal > 0 && soalList.length > limitSoal) {
      soalList = soalList.slice(0, limitSoal);
    }

    let sesi = state.db.sesi_ujian_siswa.find(
      s => s.jadwal_id === jadwal.id && s.siswa_id === state.currentUser.id
    );

    if (sesi && sesi.status === 'selesai') {
      showToast('Anda sudah menyelesaikan ujian ini.', 'error');
      return;
    }

    if (!sesi) {
      const created = await dbInsert('sesi_ujian_siswa', {
        jadwal_id: jadwal.id,
        siswa_id: state.currentUser.id,
        jawaban_json: {},
        ragu_json: {},
        jumlah_pelanggaran: 0,
        log_pelanggaran: [],
        skor_pg: 0,
        skor_essay: 0,
        nilai_akhir: 0,
        status: 'mengerjakan',
        waktu_mulai: new Date().toISOString(),
        waktu_selesai: null
      });
      sesi = created[0];
    }

    const isEnglish = Boolean(mapel?.is_english) || /inggris|english/i.test(mapel?.nama_mapel || '');
    setAntiTranslate(isEnglish);

    safeRequestFullscreen();
    await requestScreenWakeLock();

    const isLocked = sesi.status === 'terkunci';
    if (state.exam.timerInterval) clearInterval(state.exam.timerInterval);

    state.exam = {
      active: true,
      locked: isLocked,
      isSubmitting: false,
      finishedHandled: false,
      graceUntil: Date.now() + 2500, // Masa tenggang 2.5 detik saat masuk fullscreen & menutup keyboard HP
      jadwal,
      mapel,
      soalList,
      currentIndex: 0,
      jawaban: sesi.jawaban_json || {},
      ragu: sesi.ragu_json || {},
      sesiRecord: sesi,
      remainingSeconds: (jadwal.durasi_menit || 60) * 60,
      fontSize: 'base',
      showDaftarSoalMobile: false,
      timerInterval: setInterval(() => {
        if (!state.exam.active || state.exam.locked || state.exam.isSubmitting) return;
        state.exam.remainingSeconds -= 1;
        const timerEl = document.getElementById('exam-timer-text');
        const barEl = document.getElementById('exam-timer-bar');
        const pctEl = document.getElementById('exam-timer-pct');
        const totalSec = (state.exam.jadwal?.durasi_menit || 60) * 60;
        if (timerEl) timerEl.textContent = formatCountdown(state.exam.remainingSeconds);
        const pct = Math.max(0, Math.round((state.exam.remainingSeconds / totalSec) * 100));
        if (barEl) barEl.style.width = `${pct}%`;
        if (pctEl) pctEl.textContent = `${pct}%`;

        if (state.exam.remainingSeconds <= 0) {
          finalizeExamSubmission();
        }
      }, 1000),
      wakeLock: state.exam.wakeLock
    };

    render();

    if (isLocked) {
      const cfg = getSchoolConfig();
      showLockedCurtain('Sesi ujian Anda sedang dalam status TERKUNCI akibat pelanggaran sebelumnya', sesi.jumlah_pelanggaran || cfg.max_pelanggaran, cfg.max_pelanggaran);
    }
  }

  function formatCountdown(sec) {
    const s = Math.max(0, sec);
    const h = String(Math.floor(s / 3600)).padStart(2, '0');
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const d = String(s % 60).padStart(2, '0');
    return `${h}:${m}:${d}`;
  }

  async function saveAnswerProgress(soalId, value) {
    if (!state.exam.active || state.exam.isSubmitting) return;
    state.exam.jawaban[soalId] = value;
    render();
    if (state.exam.sesiRecord && !state.exam.isSubmitting) {
      try {

  function requestFinishExamConfirmation() {
    if (!state.exam.active || state.exam.isSubmitting) return;
    state.exam.graceUntil = Date.now() + 3000;

    const total = state.exam.soalList.length;
    const answered = state.exam.soalList.filter(s => {
      const a = state.exam.jawaban[s.id];
      if (Array.isArray(a)) return a.length > 0;
      if (a && typeof a === 'object') return Object.keys(a).length > 0;
      return Boolean(a && String(a).trim());
    }).length;
    const belum = total - answered;

    openConfirmDialog({
      title: 'Kumpulkan & Selesaikan Ujian?',
      message: `Anda telah menjawab ${answered} dari ${total} soal${belum > 0 ? ` (${belum} soal belum dijawab)` : ''}. Setelah dikumpulkan, jawaban tidak dapat diubah kembali.`,
      confirmLabel: 'Ya, Selesai & Kumpulkan',
      variant: 'primary',
      onConfirm: async () => {
        // Segera matikan deteksi pelanggaran sebelum keluar dari mode fullscreen
        state.exam.isSubmitting = true;
        state.exam.active = false;
        await finalizeExamSubmission();
      }
    });
  }

  async function finalizeExamSubmission() {
    if (state.exam.finishedHandled) return;
    state.exam.finishedHandled = true;
    state.exam.isSubmitting = true;
    state.exam.active = false;
    state.exam.locked = false;

    // Pastikan tirai pelanggaran tidak muncul saat siswa keluar ujian
    const curtain = document.getElementById('security-curtain');
    if (curtain) curtain.style.display = 'none';

    clearInterval(state.exam.timerInterval);
    releaseScreenWakeLock();
    setAntiTranslate(false);

    try {
      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen().catch(() => {});
      }
    } catch (e) {}

    let skorDiperolehObjektif = 0;

    state.exam.soalList.forEach(soal => {
      const tipe = (soal.tipe_soal || 'PILIHAN GANDA').toUpperCase();
      const bobot = Number(soal.bobot) || 10;
      const ans = state.exam.jawaban[soal.id];
      const kunci = (soal.kunci_jawaban || '').trim().toUpperCase();

      if (tipe !== 'URAIAN') {
        if (!ans) return;
        if (tipe === 'PILIHAN GANDA' || tipe === 'BENAR SALAH') {
          if (String(ans).trim().toUpperCase() === kunci) {
            skorDiperolehObjektif += bobot;
          }
        } else if (tipe === 'PILIHAN GANDA KOMPLEKS') {
          const userArr = Array.isArray(ans) ? ans.map(x => x.trim().toUpperCase()).sort() : [];
          const keyArr = kunci.split(',').map(x => x.trim()).filter(Boolean).sort();
          if (userArr.length > 0 && JSON.stringify(userArr) === JSON.stringify(keyArr)) {
            skorDiperolehObjektif += bobot;
          }
        } else if (tipe === 'MENJODOHKAN') {
          const pairs = Array.isArray(soal.pasangan_json) ? soal.pasangan_json : [];
          if (pairs.length > 0 && typeof ans === 'object') {
            let benar = 0;
            pairs.forEach(p => {
              if (ans[p.kiri] && ans[p.kiri].trim() === p.kanan.trim()) benar++;
            });
            skorDiperolehObjektif += (benar / pairs.length) * bobot;
          }
        }
      }
    });

    const skorPg = Math.round(skorDiperolehObjektif * 100) / 100;
    const nilaiAkhir = skorPg;
    const selesaiIso = new Date().toISOString();

    const sesiId = state.exam.sesiRecord?.id;
    const finishPayload = {
      jawaban_json: state.exam.jawaban,
      ragu_json: state.exam.ragu,
      skor_pg: skorPg,
      nilai_akhir: nilaiAkhir,
      status: 'selesai',
      waktu_selesai: selesaiIso
    };

    // Perbarui state lokal terlebih dahulu agar langsung terbaca Selesai
    if (sesiId) {
      state.db.sesi_ujian_siswa = (state.db.sesi_ujian_siswa || []).map(row =>
        row.id === sesiId ? { ...row, ...finishPayload } : row
      );
      if (state.exam.sesiRecord) {
        Object.assign(state.exam.sesiRecord, finishPayload);
      }

      // Simpan ke database dengan mekanisme retry (maksimal 3x percobaan) jika koneksi HP sempat tersendat
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          await dbUpdate('sesi_ujian_siswa', sesiId, finishPayload);
          break;
        } catch (err) {
          if (attempt < 3) {
            await new Promise(res => setTimeout(res, 700));
          }
        }
      }
    }

    state.exam.isSubmitting = false;
    state.activeMenu = 'nilai_siswa';
    state.sidebarOpen = window.innerWidth >= 1024;
    showToast('Ujian berhasil diselesaikan dan dikumpulkan!');
    render();
  }

  function buildMinimalZipBlob(files) {
    const encoder = new TextEncoder();
    const crcTable = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[i] = c;
    }
    function crc32(bytes) {
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    const localChunks = [];
    const centralChunks = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = encoder.encode(f.name);
      const dataBytes = encoder.encode(f.content);
      const crc = crc32(dataBytes);

      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, 0, true);
      lv.setUint16(12, 0, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, dataBytes.length, true);
      lv.setUint32(22, dataBytes.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);

      localChunks.push(localHeader, dataBytes);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(centralHeader.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, 0, true);
      cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, dataBytes.length, true);
      cv.setUint32(24, dataBytes.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);

      centralChunks.push(centralHeader);
      offset += localHeader.length + dataBytes.length;
    }

    const centralSize = centralChunks.reduce((acc, c) => acc + c.length, 0);
    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob([...localChunks, ...centralChunks, eocd], {
      type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  async function handleDocxSoalUpload(file, mapelId, kelasTargetStr = '') {
    if (!file || !mapelId) {
      showToast('Pilih Mata Pelajaran tujuan sebelum mengimpor soal Word (.docx)!', 'error');
      return;
    }
    if (typeof mammoth === 'undefined') {
      showToast('Library pembaca Word (.docx) belum siap, coba sesaat lagi.', 'error');
      return;
    }
    try {
      const arrayBuffer = await file.arrayBuffer();
      const htmlResult = await mammoth.convertToHtml({ arrayBuffer });
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlResult.value, 'text/html');
      const blocks = Array.from(doc.body.children);

      const parsedQuestions = [];
      let current = null;

      for (const el of blocks) {
        const img = el.querySelector('img');
        if (img && current && img.src) {
          current.gambar_url = img.src;
        }
        const text = (el.textContent || '').trim();
        if (!text) continue;

        const numMatch = text.match(/^(\d+)\.\s+(.+)/);
        if (numMatch && !/^(1\. Awali|2\. Tulis|3\. Untuk|4\. Tulis|1\. Berikan|2\. Untuk|3\. Tuliskan|4\. Untuk|5\. Untuk|6\. Tuliskan|7\. Gambar)/.test(text)) {
          if (current) parsedQuestions.push(current);
          current = {
            mapel_id: mapelId,
            kelas_target: kelasTargetStr,
            nomor_urut: parseInt(numMatch[1], 10),
            tipe_soal: 'PILIHAN GANDA',
            pertanyaan: numMatch[2],
            gambar_url: img ? img.src : '',
            opsi_a: '',
            opsi_b: '',
            opsi_c: '',
            opsi_d: '',
            pasangan_json: [],
            kunci_jawaban: '',
            bobot: 10,
            tingkat: 'Sedang',
            topik: 'Umum',
            pembahasan: ''
          };
          continue;
        }
        if (!current) continue;

        if (text.startsWith('TIPE SOAL:')) {
          current.tipe_soal = text.replace('TIPE SOAL:', '').trim().toUpperCase();
        } else if (text.startsWith('A.')) {
          current.opsi_a = text.slice(2).trim();
        } else if (text.startsWith('B.')) {
          current.opsi_b = text.slice(2).trim();
        } else if (text.startsWith('C.')) {
          current.opsi_c = text.slice(2).trim();
        } else if (text.startsWith('D.')) {
          current.opsi_d = text.slice(2).trim();
        } else if (text.startsWith('-') && text.includes('=')) {
          const [kiri, kanan] = text.slice(1).split('=');
          current.pasangan_json.push({ kiri: kiri.trim(), kanan: kanan.trim() });
        } else if (text.startsWith('KUNCI:')) {
          current.kunci_jawaban = text.replace('KUNCI:', '').trim();
        } else if (text.startsWith('PEMBAHASAN:')) {
          current.pembahasan = text.replace('PEMBAHASAN:', '').trim();
        } else if (text.startsWith('TOPIK:')) {
          current.topik = text.replace('TOPIK:', '').trim();
        }
      }
      if (current) parsedQuestions.push(current);

      if (parsedQuestions.length === 0) {
        showToast('Tidak ditemukan butir soal bernomor (1., 2., dst) di file Word.', 'error');
        return;
      }

      await dbInsert('bank_soal', parsedQuestions);
      state.filterSoalMapel = mapelId;
      showToast(`Berhasil mengimpor ${parsedQuestions.length} butir soal dari Word!`);
      render();
    } catch (err) {
      showToast('Gagal membaca file Word (.docx): ' + (err.message || err), 'error');
    }
  }

  function compressImageToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          let w = img.width;
          let h = img.height;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function exportNilaiExcel(rows, mapelName) {
    if (typeof XLSX === 'undefined') return;
    const data = rows.map((r, idx) => ({
      No: idx + 1,
      Nama_Lengkap_Siswa: r.siswa?.nama_lengkap || '-',
      NISN_No_Peserta: r.siswa?.nip_nisn || '-',
      Kelas: r.siswa?.kelas || '-',
      Skor_PG: r.sesi.skor_pg || 0,
      Skor_Essay: r.sesi.skor_essay || 0,
      Nilai_Akhir: r.sesi.nilai_akhir || 0,
      Pelanggaran: r.sesi.jumlah_pelanggaran || 0,
      Status: r.sesi.status
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Daftar Nilai');
    XLSX.writeFile(wb, `Daftar_Nilai_${mapelName || 'CBT'}.xlsx`);
    showToast('File Excel Daftar Nilai berhasil diunduh!');
  }

                </div>
              </div>

              <div class="grid grid-cols-5 gap-2 max-h-72 overflow-y-auto pr-1 mb-4">
                ${soalList.map((item, idx) => {
                  const ans = jawaban[item.id];
                  const isAnswered = Array.isArray(ans) ? ans.length > 0 : (ans && typeof ans === 'object' ? Object.keys(ans).length > 0 : Boolean(ans && String(ans).trim()));
                  const isRagu = Boolean(ragu[item.id]);
                  const isCurrent = idx === currentIndex;
                  let cls = 'bg-slate-100 text-slate-700 border-slate-200';
                  if (isRagu) cls = 'bg-amber-400 text-slate-900 border-amber-500';
                  else if (isAnswered) cls = 'bg-[#5d7359] text-white border-[#4c5f49]';
                  if (isCurrent) cls += ' ring-2 ring-offset-1 ring-slate-900';

                  return `
                    <button type="button" data-jump="${idx}" class="btn-jump-soal h-10 rounded-xl border text-xs font-extrabold transition ${cls}">
                      ${idx + 1}
                    </button>
                  `;
                }).join('')}
              </div>

              <button type="button" id="btn-submit-exam-sidebar"
                class="w-full py-3 px-4 rounded-xl bg-[#242825] hover:bg-black text-white text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition">
                <span>✓ Selesai & Kumpulkan Ujian</span>
              </button>
            </div>
          </aside>
        </main>
      </div>
    `;
  }

  function renderExamQuestionOptions(soal, currentAns, textScale) {
    const tipe = (soal.tipe_soal || 'PILIHAN GANDA').toUpperCase();

    if (tipe === 'PILIHAN GANDA' || tipe === 'BENAR SALAH') {
      const opts = tipe === 'BENAR SALAH'
        ? [{ key: 'BENAR', text: 'BENAR' }, { key: 'SALAH', text: 'SALAH' }]
        : [
            { key: 'A', text: soal.opsi_a },
            { key: 'B', text: soal.opsi_b },
            { key: 'C', text: soal.opsi_c },
            { key: 'D', text: soal.opsi_d }
          ].filter(o => o.text);

      return `
        <div class="space-y-3">
          ${opts.map(o => {
            const selected = String(currentAns || '').toUpperCase() === o.key;
            return `
              <button type="button" data-opt="${o.key}"
                class="btn-select-opt w-full text-left p-3.5 sm:p-4 rounded-2xl border transition flex items-center gap-3.5 ${selected ? 'border-[#5d7359] bg-[#eef2ed] ring-1 ring-[#5d7359]' : 'border-slate-200 bg-white hover:bg-slate-50'}">
                <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 ${selected ? 'bg-[#5d7359] text-white' : 'bg-slate-100 text-slate-700'}">
                  ${o.key}
                </span>
                <span class="${textScale} text-slate-800">${o.text}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    if (tipe === 'PILIHAN GANDA KOMPLEKS') {
      const selectedArr = Array.isArray(currentAns) ? currentAns : [];
      const opts = [
        { key: 'A', text: soal.opsi_a },
        { key: 'B', text: soal.opsi_b },
        { key: 'C', text: soal.opsi_c },
        { key: 'D', text: soal.opsi_d }
      ].filter(o => o.text);

      return `
        <div class="space-y-3">
          <p class="text-xs text-slate-500 font-semibold">* Pilih lebih dari satu jawaban yang benar:</p>
          ${opts.map(o => {
            const checked = selectedArr.includes(o.key);
            return `
              <button type="button" data-multiopt="${o.key}"
                class="btn-select-multiopt w-full text-left p-3.5 sm:p-4 rounded-2xl border transition flex items-center gap-3.5 ${checked ? 'border-[#5d7359] bg-[#eef2ed]' : 'border-slate-200 bg-white hover:bg-slate-50'}">
                <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${checked ? 'bg-[#5d7359] text-white' : 'bg-slate-100 text-slate-700'}">
                  ${checked ? '✓' : o.key}
                </span>
                <span class="${textScale} text-slate-800">${o.text}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    if (tipe === 'MENJODOHKAN') {
      const pairs = Array.isArray(soal.pasangan_json) ? soal.pasangan_json : [];
      const rightOptions = pairs.map(p => p.kanan);
      const ansObj = (currentAns && typeof currentAns === 'object') ? currentAns : {};
      return `
        <div class="space-y-3">
          <p class="text-xs text-slate-500 font-semibold">* Pasangkan pernyataan sebelah kiri dengan pasangan yang tepat:</p>
          ${pairs.map((p, i) => `
            <div class="p-3.5 rounded-xl border border-slate-200 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div class="text-sm font-bold text-slate-800">${i + 1}. ${p.kiri}</div>
              <select data-match-kiri="${p.kiri}" class="select-match px-3 py-2 rounded-lg border border-slate-300 text-xs sm:text-sm bg-slate-50">
                <option value="">-- Pilih Pasangan --</option>
                ${rightOptions.map(r => `<option value="${r}" ${ansObj[p.kiri] === r ? 'selected' : ''}>${r}</option>`).join('')}
              </select>
            </div>
          `).join('')}
        </div>
      `;
    }

    return `
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-2">Tuliskan Jawaban Uraian Anda di bawah ini:</label>
        <textarea id="input-essay-answer" rows="6" placeholder="Ketik jawaban lengkap di sini..."
          class="w-full p-4 rounded-2xl border border-slate-300 bg-white text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#5d7359]">${currentAns || ''}</textarea>
      </div>
    `;
  }

    const mapels = getAuthorizedMapels();
    const selectedMapelId = mapels.some(m => m.id === state.filterSoalMapel) ? state.filterSoalMapel : '';
    const activeMapel = mapels.find(m => m.id === selectedMapelId);

    const kelasList = selectedMapelId ? getAuthorizedKelasList(selectedMapelId) : [];
    const selectedKelas = kelasList.includes(state.filterSoalKelas) ? state.filterSoalKelas : '';

    const list = selectedMapelId
      ? state.db.bank_soal.filter(s => {
          if (s.mapel_id !== selectedMapelId) return false;
          if (selectedKelas) {
            const kTarget = (s.kelas_target || '').toLowerCase();
            if (kTarget && !kTarget.split(',').map(x => x.trim()).includes(selectedKelas.toLowerCase())) {
              return false;
            }
          }
          return true;
        })
      : [];

    const selectedCount = state.selectedIds.soal.size;

    return `
      <div class="space-y-5">
        <div class="glass-panel rounded-2xl p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
          <div>
            <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">Bank Butir Soal</h2>
            <p class="text-xs text-slate-500">
              Klik salah satu <b>Mata Pelajaran</b> di bawah untuk menampilkan butir soalnya. Tambah & impor soal (.docx) mendukung ceklis multi-kelas.
            </p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" id="btn-dl-tpl-word" class="px-3.5 py-2 rounded-xl border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold">
              ⬇ Template Word (.docx)
            </button>

            <button type="button" id="btn-open-import-docx" class="px-3.5 py-2 rounded-xl border border-indigo-300 bg-indigo-50 hover:bg-indigo-100 text-indigo-800 text-xs font-bold">
              ⬆ Import Word (.docx)
            </button>

            <button type="button" id="btn-add-soal" class="px-4 py-2 rounded-xl bg-[#5d7359] hover:bg-[#4c5f49] text-white text-xs font-bold">
              + Tambah Soal
            </button>

            ${selectedCount > 0 ? `
              <button type="button" id="btn-bulk-delete-soal" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">
                🗑 Hapus Terpilih (${selectedCount})
              </button>
            ` : ''}
          </div>
        </div>

        <div class="glass-panel rounded-2xl p-5 space-y-3">
          <div class="flex items-center justify-between">
            <div class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
              📖 Pilih Mata Pelajaran (${mapels.length} Mapel Tersedia)
            </div>
            ${selectedMapelId ? `
              <button type="button" id="btn-clear-soal-mapel" class="text-xs font-bold text-rose-600 hover:underline">
                ✕ Tutup Daftar Soal
              </button>
            ` : ''}
          </div>

          ${mapels.length === 0 ? `
            <div class="p-6 text-center text-xs text-slate-400 border border-dashed border-slate-200 rounded-xl">
              Belum ada mata pelajaran yang terdaftar / diampu.
            </div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              ${mapels.map(m => {
                const isSelected = selectedMapelId === m.id;
                const countSoalMapel = state.db.bank_soal.filter(b => b.mapel_id === m.id).length;
                const guru = state.db.users_cbt.find(u => u.id === m.guru_id);
                return `
                  <button type="button" data-pick-mapel="${m.id}"
                    class="btn-pick-soal-mapel text-left p-4 rounded-2xl border transition-all ${isSelected ? 'bg-gradient-to-br from-[#4f6d4a] to-[#3c5738] text-white border-[#4f6d4a] shadow-md' : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-800'}">
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <span class="px-2 py-0.5 rounded font-mono text-[10px] font-extrabold ${isSelected ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-600'}">
                        ${m.kode_mapel}
                      </span>
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${isSelected ? 'bg-white text-emerald-900' : 'bg-emerald-50 text-emerald-700'}">
                        ${countSoalMapel} Soal
                      </span>
                    </div>
                    <div class="text-sm font-extrabold truncate">${m.nama_mapel}</div>
                    <div class="text-[11px] mt-1 truncate ${isSelected ? 'text-emerald-100' : 'text-slate-500'}">
                      Guru: ${guru?.nama_lengkap || '-'}
                    </div>
                    ${m.kelas_ampu ? `
                      <div class="mt-2 flex flex-wrap gap-1">
                        ${parseKelasString(m.kelas_ampu).map(k => `
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${isSelected ? 'bg-white/20 text-white' : 'bg-indigo-50 text-indigo-700'}">
                            Kelas ${k}
                          </span>
                        `).join('')}
                      </div>
                    ` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          `}
        </div>

        ${!selectedMapelId ? `
          <div class="glass-panel rounded-2xl p-10 text-center space-y-2 border-dashed border-2 border-slate-200">
            <div class="text-2xl">👆</div>
            <div class="text-sm font-extrabold text-slate-800">Pilih Mata Pelajaran Terlebih Dahulu</div>
            <p class="text-xs text-slate-500 max-w-md mx-auto">
              Untuk menjaga halaman tetap ringkas, daftar butir soal disembunyikan hingga Anda mengklik salah satu mata pelajaran di atas.
            </p>
          </div>
        ` : `
          <div class="glass-panel rounded-2xl overflow-hidden">
            <div class="p-4 bg-slate-50/90 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div class="text-xs font-extrabold text-slate-900">
                  Daftar Soal: <span class="text-emerald-700">${activeMapel?.nama_mapel}</span> (${list.length} Butir)
                </div>
                <div class="text-[11px] text-slate-500">Kelas Ampu Mapel: <b>${activeMapel?.kelas_ampu || 'Semua Kelas'}</b></div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold text-slate-500">Saring Tampilan Kelas:</span>
                <select id="filter-soal-kelas" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700">
                  <option value="">Semua Kelas (${list.length})</option>
                  ${kelasList.map(k => `<option value="${k}" ${selectedKelas === k ? 'selected' : ''}>Kelas ${k}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-extrabold text-slate-500 uppercase">
                    <th class="p-3.5 w-10">
                      <input type="checkbox" id="check-all-soal" ${list.length > 0 && list.every(s => state.selectedIds.soal.has(s.id)) ? 'checked' : ''} />
                    </th>
                    <th class="p-3.5 w-12">No</th>
                    <th class="p-3.5">Tipe & Sasaran Kelas</th>
                    <th class="p-3.5">Pertanyaan & Gambar</th>
                    <th class="p-3.5">Kunci & Bobot</th>
                    <th class="p-3.5 text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs">
                  ${list.length === 0 ? `
                    <tr><td colspan="6" class="p-8 text-center text-slate-400">Belum ada butir soal pada mata pelajaran <b>${activeMapel?.nama_mapel}</b>. Klik <b>+ Tambah Soal</b> atau <b>Import Word (.docx)</b>.</td></tr>
                  ` : list.map((s, idx) => `
                    <tr class="hover:bg-slate-50/70">
                      <td class="p-3.5">
                        <input type="checkbox" class="check-row-soal" data-id="${s.id}" ${state.selectedIds.soal.has(s.id) ? 'checked' : ''} />
                      </td>
                      <td class="p-3.5 font-bold">${s.nomor_urut || idx + 1}</td>
                      <td class="p-3.5">
                        <span class="px-2 py-0.5 rounded bg-slate-100 text-[10px] font-bold text-slate-700">${s.tipe_soal}</span>
                        <div class="flex flex-wrap gap-1 mt-1">
                          ${s.kelas_target
                            ? parseKelasString(s.kelas_target).map(k => `<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-[10px] font-bold text-emerald-700">Kelas ${k}</span>`).join('')
                            : `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-[10px] text-slate-500">Semua Kelas</span>`
                          }
                        </div>
                      </td>
                      <td class="p-3.5 max-w-md">
                        <div class="line-clamp-2 text-slate-700">${s.pertanyaan}</div>
                        ${s.gambar_url ? `<span class="inline-block mt-1 px-2 py-0.5 rounded bg-sky-50 text-sky-700 text-[10px] font-bold">🖼 Soal Bergambar</span>` : ''}
                      </td>
                      <td class="p-3.5">
                        <div class="font-extrabold text-emerald-700">Kunci: ${s.kunci_jawaban || '-'}</div>
                        <div class="text-[11px] text-slate-400">Bobot: ${s.bobot || 10}</div>
                      </td>
                      <td class="p-3.5 text-right space-x-1 whitespace-nowrap">
                        <button type="button" data-edit-soal="${s.id}" class="btn-edit-soal px-2.5 py-1 rounded-lg border border-slate-200 font-bold text-slate-700 hover:bg-slate-100">Edit</button>
                        <button type="button" data-del-soal="${s.id}" class="btn-del-soal px-2.5 py-1 rounded-lg border border-rose-200 font-bold text-rose-600 hover:bg-rose-50">Hapus</button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `}
      </div>
    `;
  }

  // -------------------------------------------------------------------------
  // 3. MONITORING PESERTA (LIVE) — FILTER MAPEL TERJADWAL (KLIK BARU TAMPIL)
  // -------------------------------------------------------------------------
  function renderMonitoringSection() {
    const authMapelIds = getAuthorizedMapelIds();
    const isGuru = state.currentUser.role === 'guru';

    const scheduledList = state.db.jadwal_ujian.filter(j => !isGuru || authMapelIds.has(j.mapel_id));

    const searchQ = (state.filterMonitoringSearch || '').trim().toLowerCase();
    const filteredScheduled = searchQ
      ? scheduledList.filter(j => {
          const mp = state.db.mata_pelajaran.find(m => m.id === j.mapel_id);
          const hay = `${mp?.nama_mapel || ''} ${mp?.kode_mapel || ''} ${j.judul_ujian || ''} ${j.kelas_target || ''}`.toLowerCase();
          return hay.includes(searchQ);
        })
      : scheduledList;

    const selectedJadwalId = scheduledList.some(j => j.id === state.filterMonitoringJadwal)
      ? state.filterMonitoringJadwal
      : '';
    const activeJadwal = scheduledList.find(j => j.id === selectedJadwalId);
    const activeMapel = activeJadwal
      ? state.db.mata_pelajaran.find(m => m.id === activeJadwal.mapel_id)
      : null;

    const jadwalKelasList = activeJadwal ? parseKelasString(activeJadwal.kelas_target) : [];
    const selectedMonitoringKelas = jadwalKelasList.includes(state.filterMonitoringKelas)
      ? state.filterMonitoringKelas
      : '';

    const sesiList = selectedJadwalId
      ? state.db.sesi_ujian_siswa.filter(sesi => {
          if (sesi.jadwal_id !== selectedJadwalId) return false;
          if (selectedMonitoringKelas) {
            const siswa = state.db.users_cbt.find(u => u.id === sesi.siswa_id);
            if ((siswa?.kelas || '').toLowerCase() !== selectedMonitoringKelas.toLowerCase()) {
              return false;
            }
          }
          return true;
        })
      : [];

    const totalSoalJadwal = activeJadwal
      ? ((Array.isArray(activeJadwal.soal_ids_json) && activeJadwal.soal_ids_json.length > 0)
          ? activeJadwal.soal_ids_json.length
          : (Number(activeJadwal.jumlah_soal) || state.db.bank_soal.filter(b => b.mapel_id === activeJadwal.mapel_id).length))
      : 0;

    return `
      <div class="space-y-5">
        <div class="glass-panel rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">Monitoring Peserta Ujian (Live)</h2>
            <p class="text-xs text-slate-500">
              Klik salah satu <b>Mata Pelajaran Terjadwal</b> di bawah untuk menampilkan daftar peserta ujiannya agar halaman tetap ringkas.
            </p>
          </div>
          <button type="button" id="btn-refresh-monitoring" class="px-4 py-2 rounded-xl bg-[#5d7359] hover:bg-[#4a5d47] text-white text-xs font-bold self-start sm:self-auto">
            ↻ Segarkan Data Live
          </button>
        </div>

        <div class="glass-panel rounded-2xl p-5 space-y-3.5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="text-xs font-extrabold uppercase tracking-wider text-slate-700">
              📅 Pilih Mata Pelajaran Terjadwal (${scheduledList.length} Jadwal)
            </div>
            <div class="flex items-center gap-2">
              ${scheduledList.length > 3 ? `
                <input type="text" id="input-search-monitoring-mapel" value="${state.filterMonitoringSearch || ''}"
                  placeholder="Cari mapel / kelas..."
                  class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#5d7359]" />
              ` : ''}
              ${selectedJadwalId ? `
                <button type="button" id="btn-clear-monitoring-jadwal" class="text-xs font-bold text-rose-600 hover:underline whitespace-nowrap">
                  ✕ Tutup Daftar Peserta
                </button>
              ` : ''}
            </div>
          </div>

          ${filteredScheduled.length === 0 ? `
            <div class="p-6 text-center text-xs text-slate-400 border border-dashed border-slate-200 rounded-xl">
              ${scheduledList.length === 0
                ? 'Belum ada mata pelajaran yang dijadwalkan. Silakan buat jadwal di menu Jadwal & Token Ujian.'
                : 'Tidak ditemukan mata pelajaran terjadwal yang sesuai dengan pencarian.'}
            </div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[340px] overflow-y-auto pr-1">
              ${filteredScheduled.map(j => {
                const isSelected = selectedJadwalId === j.id;
                const mp = state.db.mata_pelajaran.find(m => m.id === j.mapel_id);
                const sesiInJadwal = state.db.sesi_ujian_siswa.filter(s => s.jadwal_id === j.id);
                const lockedCount = sesiInJadwal.filter(s => s.status === 'terkunci').length;
                const activeNowCount = sesiInJadwal.filter(s => s.status === 'mengerjakan').length;
                const { tglStr, jamMulai, jamSelesai } = formatJadwalDateAndTime(j);

                return `
                  <button type="button" data-pick-monitoring-jadwal="${j.id}"
                    class="btn-pick-monitoring-jadwal text-left p-4 rounded-2xl border transition-all ${isSelected ? 'bg-gradient-to-br from-[#4f6d4a] to-[#3c5738] text-white border-[#4f6d4a] shadow-md' : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-800'}">
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <span class="px-2 py-0.5 rounded font-mono text-[10px] font-extrabold ${isSelected ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-700'}">
                        ${mp?.kode_mapel || 'JADWAL'} • ${j.status}
                      </span>
                      <div class="flex items-center gap-1">
                        ${lockedCount > 0 ? `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-600 text-white animate-pulse">
                            🔒 ${lockedCount} Terkunci
                          </span>
                        ` : ''}
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isSelected ? 'bg-white text-emerald-900' : 'bg-emerald-50 text-emerald-700'}">
                          👥 ${sesiInJadwal.length} Peserta
                        </span>
                      </div>
                    </div>

                    <div class="text-sm font-extrabold truncate">${mp?.nama_mapel || 'Mata Pelajaran'}</div>
                    <div class="text-[11px] font-semibold truncate mt-0.5 ${isSelected ? 'text-emerald-100' : 'text-slate-600'}">
                      ${j.judul_ujian} • Kelas: <b>${j.kelas_target}</b>
                    </div>
                    <div class="text-[10px] mt-1.5 flex items-center justify-between ${isSelected ? 'text-emerald-200' : 'text-slate-400'}">
                      <span>🕒 ${tglStr} (${jamMulai}-${jamSelesai})</span>
                      ${activeNowCount > 0 ? `<span class="font-bold ${isSelected ? 'text-white' : 'text-amber-600'}">● ${activeNowCount} Live</span>` : ''}
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          `}
        </div>

        ${!selectedJadwalId ? `
          <div class="glass-panel rounded-2xl p-10 text-center space-y-2 border-dashed border-2 border-slate-200">
            <div class="text-2xl">👆</div>
            <div class="text-sm font-extrabold text-slate-800">Pilih Mata Pelajaran Terjadwal Terlebih Dahulu</div>
            <p class="text-xs text-slate-500 max-w-md mx-auto">
              Daftar peserta ujian tidak ditampilkan sekaligus agar layar tetap ringkas dan fokus. Klik salah satu kartu mapel terjadwal di atas untuk memantau pesertanya.
            </p>
          </div>
        ` : `
          <div class="glass-panel rounded-2xl overflow-hidden">
            <div class="p-4 bg-slate-50/90 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs sm:text-sm font-extrabold text-slate-900">
                    Peserta Live: <span class="text-emerald-700">${activeMapel?.nama_mapel || '-'}</span> — ${activeJadwal?.judul_ujian || ''}
                  </span>
                  <span class="px-2 py-0.5 rounded bg-slate-900 text-emerald-400 font-mono text-[11px] font-extrabold">
                    Token: ${activeJadwal?.token_ujian || '-'}
                  </span>
                </div>
                <div class="text-[11px] text-slate-500 mt-0.5">
                  Menampilkan <b>${sesiList.length}</b> peserta aktif/selesai • Target Kelas: <b>${activeJadwal?.kelas_target || '-'}</b>
                </div>
              </div>

              ${jadwalKelasList.length > 1 ? `
                <div class="flex items-center gap-2">
                  <span class="text-[11px] font-bold text-slate-500">Filter Kelas:</span>
                  <select id="filter-monitoring-kelas" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-bold text-slate-700">
                    <option value="">Semua Kelas (${activeJadwal?.kelas_target})</option>
                    ${jadwalKelasList.map(k => `<option value="${k}" ${selectedMonitoringKelas === k ? 'selected' : ''}>Kelas ${k}</option>`).join('')}
                  </select>
                </div>
              ` : ''}
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-extrabold text-slate-500 uppercase">
                    <th class="p-3.5">Peserta & Kelas</th>
                    <th class="p-3.5">Progres Soal</th>
                    <th class="p-3.5">Pelanggaran Anti-Curang</th>
                    <th class="p-3.5">Status</th>
                    <th class="p-3.5 text-right">Aksi Pengawas / Guru</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs">
                  ${sesiList.length === 0 ? `
                    <tr><td colspan="5" class="p-8 text-center text-slate-400">Belum ada peserta yang masuk/mengerjakan pada mata pelajaran terjadwal <b>${activeMapel?.nama_mapel || ''}</b>${selectedMonitoringKelas ? ` (Kelas ${selectedMonitoringKelas})` : ''}.</td></tr>
                  ` : sesiList.map(sesi => {
                    const siswa = state.db.users_cbt.find(u => u.id === sesi.siswa_id);
                    const answeredCount = sesi.jawaban_json ? Object.keys(sesi.jawaban_json).length : 0;
                    const pelanggaran = sesi.jumlah_pelanggaran || 0;
                    const isLocked = sesi.status === 'terkunci';
                    const isDone = sesi.status === 'selesai';

                    return `
                      <tr class="hover:bg-slate-50/70 ${isLocked ? 'bg-rose-50/60' : ''}">
                        <td class="p-3.5">
                          <div class="font-bold text-slate-900">${siswa?.nama_lengkap || 'Siswa'}</div>
                          <div class="text-[11px] text-slate-500">NISN: ${siswa?.nip_nisn || '-'} • Kelas: <b>${siswa?.kelas || '-'}</b></div>
                        </td>
                        <td class="p-3.5 font-bold text-slate-700">${answeredCount} / ${totalSoalJadwal} Butir</td>
                        <td class="p-3.5">
                          <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold ${pelanggaran > 0 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${pelanggaran} Pelanggaran
                          </span>
                        </td>
                        <td class="p-3.5">
                          ${isLocked ? `
                            <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-rose-600 text-white">
                              🔒 TERKUNCI
                            </span>
                          ` : isDone ? `
                            <span class="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-emerald-100 text-emerald-800">
                              ✓ Selesai (Nilai: ${sesi.nilai_akhir || 0})
                            </span>
                          ` : `
                            <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">
                              Sedang Mengerjakan
                            </span>
                          `}
                        </td>
                        <td class="p-3.5 text-right space-x-1.5 whitespace-nowrap">
                          ${isLocked ? `
                            <button type="button" data-unlock-sesi="${sesi.id}" class="btn-unlock-sesi px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
                              🔓 Buka Kunci
                            </button>
                          ` : ''}
                          <button type="button" data-reset-login="${siswa?.id || ''}" class="btn-reset-login px-3 py-1.5 rounded-lg border border-amber-300 bg-amber-50 text-amber-800 font-bold hover:bg-amber-100">
                            Reset Login
                          </button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `}
      </div>
    `;
  }

  function getDefaultBeritaAcaraData(cfg, jadwal, mapel, totalSiswa) {
    const hariIni = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    }).format(new Date());
    const tglTtd = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar', day: 'numeric', month: 'long', year: 'numeric'
    }).format(new Date());

    return {
      judul_dokumen: 'BERITA ACARA PELAKSANAAN ASESMEN / UJIAN BERBASIS KOMPUTER',
      hari_tanggal: hariIni,
      mata_pelajaran: `${jadwal?.judul_ujian || 'Ujian CBT'} - ${mapel?.nama_mapel || 'Semua Mata Pelajaran'}`,
      ruang_sesi: 'Ruang 01 / Lab Komputer 1 - Sesi 1',
      waktu_pelaksanaan: '07.30 - 09.30 WITA',
      jumlah_seharusnya: String(totalSiswa),
      jumlah_hadir: String(totalSiswa),
      jumlah_tidak_hadir: '0',
      rincian_tidak_hadir: 'Nihil (Semua peserta hadir lengkap)',
      catatan_khusus: 'Pelaksanaan asesmen CBT berjalan tertib, aman, lancar dan terkendali. Tidak ada kendala teknis server lokal maupun pemadaman listrik.',
      tempat_tanggal_ttd: `Muara Kaman, ${tglTtd}`
    };
  }

            ${state.docType === 'berita_acara' ? `

              <div>
                <label class="block font-bold text-slate-700 mb-1">Jumlah Peserta Seharusnya</label>

  function formatJadwalDateAndTime(j) {
    const startObj = j.waktu_mulai ? new Date(j.waktu_mulai) : new Date();
    const endObj = j.waktu_selesai ? new Date(j.waktu_selesai) : new Date(Date.now() + 5400000);

    const tglStr = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      weekday: 'short',
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    }).format(startObj);

    const jamMulai = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      hour: '2-digit',
      minute: '2-digit'
    }).format(startObj).replace('.', ':');

    const jamSelesai = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Makassar',
      hour: '2-digit',
      minute: '2-digit'
    }).format(endObj).replace('.', ':');

    return { tglStr, jamMulai, jamSelesai };
  }

  function getFilteredNilaiContext() {
    const authMapelIds = getAuthorizedMapelIds();
    const isGuru = state.currentUser.role === 'guru';

    const jadwals = state.db.jadwal_ujian.filter(j => !isGuru || authMapelIds.has(j.mapel_id));
    const activeJadwalId = jadwals.some(j => j.id === state.filterNilaiJadwal)
      ? state.filterNilaiJadwal
      : (jadwals[0]?.id || '');
    const activeJadwal = jadwals.find(j => j.id === activeJadwalId);
    const activeMapel = state.db.mata_pelajaran.find(m => m.id === activeJadwal?.mapel_id);
    const jadwalKelasList = activeJadwal ? parseKelasString(activeJadwal.kelas_target) : [];
    const activeKelas = jadwalKelasList.includes(state.filterNilaiKelas) ? state.filterNilaiKelas : '';

    const rows = state.db.sesi_ujian_siswa
      .filter(s => {
        if (activeJadwalId && s.jadwal_id !== activeJadwalId) return false;
        if (!activeJadwalId && isGuru) {
          const jd = state.db.jadwal_ujian.find(j => j.id === s.jadwal_id);
          if (!jd || !authMapelIds.has(jd.mapel_id)) return false;
        }
        if (activeKelas) {
          const siswa = state.db.users_cbt.find(u => u.id === s.siswa_id);
          if ((siswa?.kelas || '').toLowerCase() !== activeKelas.toLowerCase()) return false;
        }
        return true;
      })
      .map(sesi => ({
        sesi,
        siswa: state.db.users_cbt.find(u => u.id === sesi.siswa_id)
      }));

    return { jadwals, activeJadwalId, activeJadwal, activeMapel, jadwalKelasList, activeKelas, rows };
  }

  // -------------------------------------------------------------------------
  // 10. PANEL SISWA
  // -------------------------------------------------------------------------
  function renderJadwalSiswaSection() {
    const siswa = state.currentUser;
    const siswaKelas = (siswa.kelas || '').trim().toLowerCase();
    const siswaAgama = (siswa.agama || 'Islam').trim().toLowerCase();

    const availableJadwals = state.db.jadwal_ujian.filter(j => {
      if (j.status !== 'Aktif') return false;
      const targetClasses = (j.kelas_target || '').toLowerCase().split(',').map(x => x.trim());
      const classMatch = targetClasses.includes('semua') || targetClasses.includes(siswaKelas);
      if (!classMatch) return false;

      const mapel = state.db.mata_pelajaran.find(m => m.id === j.mapel_id);
      if (mapel?.kategori_agama && mapel.kategori_agama.trim() !== '') {
        return mapel.kategori_agama.trim().toLowerCase() === siswaAgama;
      }
      return true;
    });

    const selesaiCount = state.db.sesi_ujian_siswa.filter(
      s => s.siswa_id === siswa.id && s.status === 'selesai'
    ).length;

    return `
      <div class="space-y-6">
        <div class="glass-panel rounded-2xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 flex-wrap mb-1.5">
              <span class="px-2.5 py-0.5 rounded-md bg-[#eef2ed] text-[#4f6d4a] text-xs font-extrabold">${siswa.kelas || '-'}</span>
              <span class="px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600 text-xs font-bold">NISN: ${siswa.nip_nisn || '-'}</span>
              <span class="px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 text-xs font-bold">Agama: ${siswa.agama || 'Islam'}</span>
            </div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">Selamat Datang, ${siswa.nama_lengkap}!</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Pastikan koneksi perangkat stabil dan baca petunjuk pengerjaan sebelum memulai ujian.</p>
          </div>
          <div class="flex items-center gap-4 px-5 py-3 rounded-2xl bg-[#f5f6f2] border border-slate-200/80 shrink-0">
            <div class="text-center">
              <div class="text-[10px] font-extrabold text-slate-400">TERSEDIA</div>
              <div class="text-xl font-extrabold text-slate-800">${availableJadwals.length}</div>
            </div>
            <div class="h-8 w-px bg-slate-200"></div>
            <div class="text-center">
              <div class="text-[10px] font-extrabold text-slate-400">SELESAI</div>
              <div class="text-xl font-extrabold text-emerald-700">${selesaiCount}</div>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-slate-800">📅 Daftar Ujian Aktif Hari Ini</h3>
          <span class="text-xs text-slate-500">${availableJadwals.length} Ujian Siap Dikerjakan</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          ${availableJadwals.length === 0 ? `
            <div class="md:col-span-2 glass-panel rounded-2xl p-8 text-center text-sm text-slate-400">
              Tidak ada jadwal ujian aktif untuk kelas (${siswa.kelas}) dan agama (${siswa.agama}) Anda saat ini.
            </div>
          ` : availableJadwals.map(j => {
            const mp = state.db.mata_pelajaran.find(m => m.id === j.mapel_id);
            const guru = state.db.users_cbt.find(u => u.id === mp?.guru_id);
            const soalCount = (Array.isArray(j.soal_ids_json) && j.soal_ids_json.length > 0)
              ? j.soal_ids_json.length
              : (Number(j.jumlah_soal) || state.db.bank_soal.filter(b => b.mapel_id === j.mapel_id).length);
            const { tglStr, jamMulai, jamSelesai } = formatJadwalDateAndTime(j);
            const sesiExist = state.db.sesi_ujian_siswa.find(s => s.jadwal_id === j.id && s.siswa_id === siswa.id);
            const sesiDone = sesiExist && sesiExist.status === 'selesai';
            const sesiLocked = sesiExist && sesiExist.status === 'terkunci';

            return `
              <div class="glass-panel rounded-2xl p-5 flex flex-col justify-between space-y-4">
                <div>
                  <div class="flex items-center justify-between mb-2">
                    <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 text-xs font-extrabold">${mp?.nama_mapel || 'Mapel'}</span>
                    <span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${sesiDone ? 'bg-slate-200 text-slate-700' : sesiLocked ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                      ${sesiDone ? '✓ Sudah Dikerjakan' : sesiLocked ? '🔒 Terkunci (Hubungi Pengawas)' : '● Sedang Berlangsung'}
                    </span>
                  </div>
                  <h4 class="text-base font-extrabold text-slate-900 mb-2">${j.judul_ujian}</h4>

                  <div class="grid grid-cols-3 gap-2 p-2.5 rounded-xl bg-emerald-50/70 border border-emerald-200/70 text-[11px] mb-3">
                    <div>
                      <div class="text-[10px] text-slate-500 font-semibold">Tanggal</div>
                      <div class="font-extrabold text-slate-800">${tglStr}</div>
                    </div>
                    <div>
                      <div class="text-[10px] text-slate-500 font-semibold">Mulai (Jam)</div>
                      <div class="font-extrabold text-emerald-700">${jamMulai} WITA</div>
                    </div>
                    <div>
                      <div class="text-[10px] text-slate-500 font-semibold">Selesai (Jam)</div>
                      <div class="font-extrabold text-rose-700">${jamSelesai} WITA</div>
                    </div>
                  </div>

                  <div class="flex flex-wrap gap-2 text-[11px] text-slate-600 mb-4">
                    <span class="px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200">⏱ Durasi: <b>${j.durasi_menit} Menit</b></span>
                    <span class="px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200">📄 <b>${soalCount} Butir Soal</b></span>
                    <span class="px-2.5 py-1 rounded-lg bg-slate-50 border border-slate-200">🔑 Wajib Token</span>
                  </div>
                  <div class="text-xs text-slate-500 flex items-center justify-between pt-2 border-t border-slate-100">
                    <span>Guru: <b>${guru?.nama_lengkap || '-'}</b></span>
                    <span>Kelas: <b>${j.kelas_target}</b></span>
                  </div>
                </div>

                ${sesiDone ? `
                  <button type="button" disabled class="w-full py-3 rounded-xl bg-slate-200 text-slate-500 text-xs font-extrabold">
                    Ujian Selesai (Nilai: ${sesiExist.nilai_akhir})
                  </button>
                ` : `
                  <button type="button" data-open-token="${j.id}" class="btn-open-token w-full py-3 rounded-xl ${sesiLocked ? 'bg-rose-600 hover:bg-rose-700' : 'bg-[#6b7f66] hover:bg-[#576952]'} text-white text-xs font-extrabold transition">
                    ${sesiLocked ? '🔒 Sesi Terkunci — Cek Status Kunci →' : '🔑 Masukkan Token & Mulai Ujian →'}
                  </button>
                `}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

    return `

                ` : mySessions.map(sesi => {

                      <td class="p-3.5"><span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold">${sesi.status === 'selesai' ? 'Selesai' : sesi.status}</span></td>
