  function renderConfirmDialog() {
    if (!state.confirmDialog) return '';
    const { title, message, confirmLabel, variant } = state.confirmDialog;
    const btnCls = variant === 'danger'
      ? 'bg-rose-600 hover:bg-rose-700 text-white'
      : variant === 'warning'
        ? 'bg-amber-600 hover:bg-amber-700 text-white'
        : 'bg-[#5d7359] hover:bg-[#4a5d47] text-white';

    return `
      <div class="fixed inset-0 z-[9999998] bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 no-print">
        <div class="w-full max-w-md bg-white rounded-2xl p-6 space-y-4 shadow-2xl border border-slate-100">
          <h3 class="text-base font-extrabold text-slate-900">${title}</h3>
          <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${message}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="btn-confirm-cancel" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50">
              Batal
            </button>
            <button type="button" id="btn-confirm-yes" class="px-4 py-2.5 rounded-xl ${btnCls} text-xs font-extrabold shadow-xs">
              ${confirmLabel}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function renderKelasChecklistBox(allKelas, selectedSet, checkboxClass, selectAllBtnId, clearBtnId) {

            <button type="button" id="${clearBtnId}" class="px-2 py-0.5 rounded bg-white border border-slate-300 text-[10px] font-bold text-slate-500 hover:bg-slate-100">
              Kosongkan
            </button>

        ${allKelas.length === 0 ? `
          <div class="text-[11px] text-slate-400">Belum ada daftar kelas. Tambahkan kelas di Data Siswa atau Mata Pelajaran.</div>

          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-28 overflow-y-auto p-1">

                  <input type="checkbox" class="${checkboxClass}" value="${k}" ${checked ? 'checked' : ''} />

          </div>

  function renderModal() {

    const { type, data } = state.modal;

    if (type === 'token') {

        <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">

              class="w-full px-4 py-3 rounded-xl border border-slate-300 text-center font-mono text-base font-extrabold uppercase tracking-widest" />
            <div class="flex justify-end gap-2">
              <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold">Batal</button>

    if (type === 'import_docx') {

              <label class="block font-bold mb-1">Mata Pelajaran Tujuan</label>

              'btn-import-kelas-all',
              'btn-import-kelas-clear'
            )}

            <div>
              <label class="block font-bold mb-1">Pilih File Microsoft Word (.docx)</label>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl border border-slate-200 font-bold">Batal</button>

            </div>
          </form>

      `;
    }

    if (type === 'soal') {
      const s = data || {};
      const authMapels = getAuthorizedMapels();
      const activeMapelId = s.mapel_id || authMapels[0]?.id || '';
      const authKelas = getAuthorizedKelasList(activeMapelId);
      const imgPreview = state.modalSoalImagePreview;

              <div>

        </div>

              ${masterKelas.length > 0 ? `

      const defaultEndTime = `${pad(endDt.getHours())}:${pad(endDt.getMinutes())}`;
      const jumlahSoalVal = state.modalJadwalSelectedSoal.size > 0
        ? state.modalJadwalSelectedSoal.size
        : (j.jumlah_soal || mapelSoals.length || 0);

                <input type="number" id="input-jadwal-jumlah-soal" name="jumlah_soal" min="0" value="${jumlahSoalVal}" required class="w-full p-2.5 rounded-xl border border-slate-200 font-bold text-indigo-700" />

                  </button>
                  <button type="button" id="btn-jadwal-uncheck-all-soal" class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-[11px] font-bold text-slate-500 hover:bg-slate-100">
                    Kosongkan
                  </button>
                </div>
              </div>

              <div class="max-h-44 overflow-y-auto divide-y divide-slate-200/70 bg-white rounded-xl border border-slate-200 p-2">
                ${mapelSoals.length === 0 ? `
                  <div class="p-4 text-center text-slate-400">Belum ada butir soal pada mata pelajaran ini.</div>
                ` : mapelSoals.map((s, idx) => {
                  const checked = state.modalJadwalSelectedSoal.has(s.id);
                  return `
                    <label class="flex items-start gap-2.5 p-2 hover:bg-slate-50 rounded-lg cursor-pointer">
                      <input type="checkbox" class="chk-jadwal-soal mt-0.5" data-soalid="${s.id}" ${checked ? 'checked' : ''} />
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                          <span class="font-extrabold text-slate-800">No. ${s.nomor_urut || idx + 1}</span>
                          <span class="px-1.5 py-0.2 rounded bg-slate-100 text-[10px] font-bold text-slate-600">${s.tipe_soal}</span>
                          ${s.kelas_target ? `<span class="px-1.5 py-0.2 rounded bg-emerald-50 text-[10px] font-bold text-emerald-700">Kelas ${s.kelas_target}</span>` : ''}
                        </div>
                        <div class="text-[11px] text-slate-600 line-clamp-1 mt-0.5">${s.pertanyaan}</div>
                      </div>
                    </label>
                  `;
                }).join('')}
              </div>
              <p class="text-[10px] text-slate-500">* Centang soal tertentu yang ingin ditampilkan saat ujian, atau kosongkan untuk memuat otomatis sesuai target kelas.</p>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl border border-slate-200 font-bold">Batal</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-[#5d7359] hover:bg-[#4a5d47] text-white font-bold">
                ${j.id ? 'Simpan Perubahan Jadwal' : 'Terbitkan Jadwal'}
              </button>
            </div>
          </form>
        </div>
      `;
    }

    if (type === 'essay') {
      const sesi = data;
      const siswa = state.db.users_cbt.find(u => u.id === sesi.siswa_id);
      const jadwal = state.db.jadwal_ujian.find(j => j.id === sesi.jadwal_id);
      const checkedIds = Array.isArray(jadwal?.soal_ids_json) ? jadwal.soal_ids_json : [];
      const essaySoals = state.db.bank_soal
        .filter(s => {
          if (s.mapel_id !== jadwal?.mapel_id) return false;
          if ((s.tipe_soal || '').toUpperCase() !== 'URAIAN') return false;
          if (checkedIds.length > 0) return checkedIds.includes(s.id);
          return true;
        })
        .sort((a, b) => (a.nomor_urut || 0) - (b.nomor_urut || 0));
      const jawabanMap = sesi.jawaban_json || {};

      return `
        <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <form id="form-koreksi-essay" class="w-full max-w-xl bg-white rounded-2xl p-6 space-y-4 shadow-2xl my-8 text-xs">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
              <div>
                <h3 class="text-base font-extrabold text-slate-900">Input / Koreksi Skor Essay</h3>
                <p class="text-[11px] text-slate-500">Peserta: <b>${siswa?.nama_lengkap || '-'}</b> (${siswa?.kelas || '-'})</p>
              </div>
              <span class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-extrabold">Skor PG: ${sesi.skor_pg || 0}</span>
            </div>

            <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
              ${essaySoals.length === 0 ? `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-slate-500">
                  Tidak ada butir soal bertipe URAIAN pada jadwal ini, namun Anda tetap dapat memasukkan nilai tambahan secara manual di bawah.
                </div>
              ` : essaySoals.map((sq, idx) => `
                <div class="p-3.5 rounded-xl border border-slate-200 bg-slate-50/70 space-y-2">
                  <div class="flex items-center justify-between">
                    <span class="font-extrabold text-slate-800">Soal Uraian #${idx + 1}</span>
                    <span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-bold text-[10px]">Bobot Maks: ${sq.bobot || 10}</span>
                  </div>
                  <div class="text-slate-700 leading-relaxed">${sq.pertanyaan}</div>
                  <div class="p-2.5 rounded-lg bg-white border border-slate-200">
                    <div class="text-[10px] font-extrabold text-emerald-700 uppercase mb-1">Jawaban Tertulis Siswa:</div>
                    <div class="text-slate-900 font-medium whitespace-pre-line">${jawabanMap[sq.id] ? jawabanMap[sq.id] : '<i class="text-slate-400">(Siswa tidak mengisi jawaban uraian ini)</i>'}</div>
                  </div>
                  ${sq.kunci_jawaban ? `
                    <div class="text-[11px] text-slate-500">
                      <b>Rubrik / Kunci:</b> ${sq.kunci_jawaban}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>

            <div>
              <label class="block font-bold text-slate-800 mb-1">Total Skor Essay (Akan ditambahkan ke Skor PG)</label>
              <input type="number" step="0.1" min="0" name="skor_essay" value="${sesi.skor_essay || 0}" required class="w-full p-2.5 rounded-xl border border-slate-300 font-extrabold text-sm text-indigo-700" />
            </div>
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl border border-slate-200 font-bold">Batal</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-[#5d7359] hover:bg-[#4a5d47] text-white font-bold">Simpan Nilai</button>
            </div>
          </form>
        </div>
      `;
    }

    return '';
  }

  // =========================================================================
  // MAIN RENDER & EVENT BINDINGS
  // =========================================================================
  function render() {
    const root = document.getElementById('cbt-promax-root');
    if (!root) return;

    let html = '';
    if (!state.currentUser) {
      html = renderLoginView();
    } else if (state.exam.active) {
      html = renderStudentExamView() + renderConfirmDialog();
    } else {
      html = renderMainShell() + renderModal() + renderConfirmDialog();
    }

    if (state.toast) {
      const bg = state.toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
      html += `
        <div class="fixed top-4 right-4 z-[9999999] ${bg} text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 no-print">
          <span>${state.toast.type === 'error' ? '⚠' : '✓'}</span>
          <span>${state.toast.message}</span>
        </div>
      `;
    }

    root.innerHTML = html;
    bindEvents();
  }

  function bindEvents() {
    document.getElementById('btn-confirm-cancel')?.addEventListener('click', () => {
      state.confirmDialog = null;
      render();
    });
    document.getElementById('btn-confirm-yes')?.addEventListener('click', async () => {
      const fn = state.confirmDialog?.onConfirm;
      state.confirmDialog = null;
      render();
      if (typeof fn === 'function') await fn();
    });

    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('login-username').value;
      const p = document.getElementById('login-password').value;
      handleLogin(u, p);
    });

    document.getElementById('toggle-pwd-btn')?.addEventListener('click', () => {
      const inp = document.getElementById('login-password');
      if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('btn-logout')?.addEventListener('click', handleLogout);

    // Toggle Sidebar Otomatis di Pojok Kiri Atas (HP, Tablet & Desktop)
    document.getElementById('btn-toggle-sidebar')?.addEventListener('click', () => {
      state.sidebarOpen = !state.sidebarOpen;
      render();
    });

    document.getElementById('btn-close-sidebar-inside')?.addEventListener('click', () => {
      state.sidebarOpen = false;
      render();
    });

    document.getElementById('sidebar-backdrop')?.addEventListener('click', () => {
      state.sidebarOpen = false;
      render();
    });

    document.querySelectorAll('.nav-menu-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeMenu = btn.getAttribute('data-menu');
        // Pada layar HP/tablet (<1024px), sidebar otomatis menutup setelah memilih menu
        if (window.innerWidth < 1024) {
          state.sidebarOpen = false;
        }
        render();
      });
    });

    document.getElementById('btn-close-modal')?.addEventListener('click', () => {
      state.modal = null;
      render();
    });

    // --- Bank Soal Events ---
    document.querySelectorAll('.btn-pick-soal-mapel').forEach(btn => {
      btn.addEventListener('click', () => {
        const mpId = btn.getAttribute('data-pick-mapel');
        state.filterSoalMapel = (state.filterSoalMapel === mpId) ? '' : mpId;
        state.filterSoalKelas = '';
        state.selectedIds.soal.clear();
        render();
      });
    });

    document.getElementById('btn-clear-soal-mapel')?.addEventListener('click', () => {
      state.filterSoalMapel = '';
      state.filterSoalKelas = '';
      state.selectedIds.soal.clear();
      render();
    });

    document.getElementById('filter-soal-kelas')?.addEventListener('change', (e) => {
      state.filterSoalKelas = e.target.value;
      state.selectedIds.soal.clear();
      render();
    });

    document.getElementById('btn-dl-tpl-word')?.addEventListener('click', downloadWordSoalTemplate);

    document.getElementById('btn-open-import-docx')?.addEventListener('click', () => {
      const authMapels = getAuthorizedMapels();
      if (authMapels.length === 0) {
        showToast('Anda belum memiliki mata pelajaran yang diampu!', 'error');
        return;
      }
      const targetMpId = state.filterSoalMapel || authMapels[0]?.id || '';
      const targetMp = authMapels.find(m => m.id === targetMpId);
      state.modalImportMapelId = targetMpId;
      state.modalImportSelectedKelas = new Set(parseKelasString(targetMp?.kelas_ampu));
      state.modal = { type: 'import_docx', data: {} };
      render();
    });

    document.getElementById('select-import-docx-mapel')?.addEventListener('change', (e) => {
      const mpId = e.target.value;
      state.modalImportMapelId = mpId;
      const mp = getAuthorizedMapels().find(m => m.id === mpId);
      state.modalImportSelectedKelas = new Set(parseKelasString(mp?.kelas_ampu));
      render();
    });

    document.querySelectorAll('.chk-import-kelas').forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) state.modalImportSelectedKelas.add(chk.value);
        else state.modalImportSelectedKelas.delete(chk.value);
        render();
      });
    });

    document.getElementById('btn-import-kelas-all')?.addEventListener('click', () => {
      const all = getAuthorizedKelasList(state.modalImportMapelId);
      state.modalImportSelectedKelas = new Set(all);
      render();
    });

    document.getElementById('btn-import-kelas-clear')?.addEventListener('click', () => {
      state.modalImportSelectedKelas.clear();
      render();
    });

    document.getElementById('form-import-docx')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInp = document.getElementById('file-import-docx-modal');
      const file = fileInp?.files?.[0];
      const mapelId = state.modalImportMapelId;
      const kelasStr = [...state.modalImportSelectedKelas].join(', ');
      state.modal = null;
      render();
      await handleDocxSoalUpload(file, mapelId, kelasStr);
    });

    document.getElementById('btn-add-soal')?.addEventListener('click', () => {
      const authMapels = getAuthorizedMapels();
      if (authMapels.length === 0) {
        showToast('Anda belum memiliki mata pelajaran yang diampu!', 'error');
        return;
      }
      const targetMpId = state.filterSoalMapel || authMapels[0]?.id;
      const targetMp = authMapels.find(m => m.id === targetMpId);
      state.modalSoalImagePreview = '';
      state.modalSoalSelectedKelas = new Set(parseKelasString(targetMp?.kelas_ampu));
      state.modal = {
        type: 'soal',
        data: { mapel_id: targetMpId }
      };
      render();
    });

    document.querySelectorAll('.btn-edit-soal').forEach(btn => {
      btn.addEventListener('click', () => {
        const soal = state.db.bank_soal.find(s => s.id === btn.getAttribute('data-edit-soal'));
        state.modalSoalImagePreview = soal?.gambar_url || '';
        state.modalSoalSelectedKelas = new Set(parseKelasString(soal?.kelas_target));
        state.modal = { type: 'soal', data: soal };
        render();
      });
    });

    document.getElementById('select-soal-modal-mapel')?.addEventListener('change', (e) => {
      const newMpId = e.target.value;
      if (state.modal?.data) state.modal.data.mapel_id = newMpId;
      const mp = getAuthorizedMapels().find(m => m.id === newMpId);
      state.modalSoalSelectedKelas = new Set(parseKelasString(mp?.kelas_ampu));
      render();
    });

    document.querySelectorAll('.chk-soal-kelas').forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) state.modalSoalSelectedKelas.add(chk.value);
        else state.modalSoalSelectedKelas.delete(chk.value);
        render();
      });
    });

    document.getElementById('btn-soal-kelas-all')?.addEventListener('click', () => {
      const activeMpId = state.modal?.data?.mapel_id || getAuthorizedMapels()[0]?.id || '';
      state.modalSoalSelectedKelas = new Set(getAuthorizedKelasList(activeMpId));
      render();
    });

    document.getElementById('btn-soal-kelas-clear')?.addEventListener('click', () => {
      state.modalSoalSelectedKelas.clear();
      render();
    });

    document.getElementById('input-soal-image-file')?.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const compressed = await compressImageToDataUrl(file);
        state.modalSoalImagePreview = compressed;
        const urlInp = document.getElementById('input-soal-image-url');
        if (urlInp) urlInp.value = compressed;
        render();
      } catch (err) {
        showToast('Gagal memproses gambar soal', 'error');
      }
    });

    document.getElementById('input-soal-image-url')?.addEventListener('input', (e) => {
      state.modalSoalImagePreview = e.target.value;
    });

    document.getElementById('btn-clear-soal-image')?.addEventListener('click', () => {
      state.modalSoalImagePreview = '';
      render();
    });

    document.querySelectorAll('.btn-del-soal').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-del-soal');
        openConfirmDialog({
          title: 'Hapus Butir Soal?',
          message: 'Butir soal ini akan dihapus permanen dari bank soal.',
          confirmLabel: 'Ya, Hapus Soal',
          variant: 'danger',
          onConfirm: async () => {
            await dbDeleteMany('bank_soal', [id]);
            showToast('Soal dihapus');
            render();
          }
        });
      });
    });

    document.getElementById('check-all-soal')?.addEventListener('change', (e) => {
      if (!state.filterSoalMapel) return;
      const visible = state.db.bank_soal.filter(s => {
        if (s.mapel_id !== state.filterSoalMapel) return false;
        if (state.filterSoalKelas) {
          const kTarget = (s.kelas_target || '').toLowerCase();
          if (kTarget && !kTarget.split(',').map(x => x.trim()).includes(state.filterSoalKelas.toLowerCase())) {
            return false;
          }
        }
        return true;
      });
      if (e.target.checked) visible.forEach(s => state.selectedIds.soal.add(s.id));
      else state.selectedIds.soal.clear();
      render();
    });

    document.querySelectorAll('.check-row-soal').forEach(chk => {
      chk.addEventListener('change', () => {
        const id = chk.getAttribute('data-id');
        if (chk.checked) state.selectedIds.soal.add(id);
        else state.selectedIds.soal.delete(id);
        render();
      });
    });

    document.getElementById('btn-bulk-delete-soal')?.addEventListener('click', () => {
      const ids = [...state.selectedIds.soal];
      openConfirmDialog({
        title: `Hapus Massal ${ids.length} Butir Soal?`,
        message: `Seluruh ${ids.length} butir soal yang dicentang akan dihapus secara permanen.`,
        confirmLabel: `Hapus ${ids.length} Soal`,
        variant: 'danger',
        onConfirm: async () => {
          await dbDeleteMany('bank_soal', ids);
          state.selectedIds.soal.clear();
          showToast(`${ids.length} butir soal berhasil dihapus massal!`);
          render();
        }
      });
    });

    document.getElementById('form-crud-soal')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const fd = new FormData(e.target);
        const chosenMapelId = fd.get('mapel_id') || null;
        const payload = {
          mapel_id: chosenMapelId,
          kelas_target: [...state.modalSoalSelectedKelas].join(', '),
          tipe_soal: fd.get('tipe_soal'),
          pertanyaan: fd.get('pertanyaan'),
          gambar_url: state.modalSoalImagePreview || fd.get('gambar_url') || '',
          opsi_a: fd.get('opsi_a'),
          opsi_b: fd.get('opsi_b'),
          opsi_c: fd.get('opsi_c'),
          opsi_d: fd.get('opsi_d'),
          kunci_jawaban: fd.get('kunci_jawaban'),
          bobot: Number(fd.get('bobot')) || 10,
          nomor_urut: state.modal.data?.nomor_urut || state.db.bank_soal.length + 1
        };
        if (state.modal.data?.id) {
          await dbUpdate('bank_soal', state.modal.data.id, payload);
          showToast('Soal diperbarui');
        } else {
          await dbInsert('bank_soal', payload);
          showToast('Soal baru ditambahkan');
        }
        if (chosenMapelId) state.filterSoalMapel = chosenMapelId;
        state.modal = null;
        state.modalSoalImagePreview = '';
        render();
      } catch (err) {
        showToast('Gagal menyimpan soal: ' + (err.message || err), 'error');
      }
    });

    // --- Monitoring Live: Pilih Mapel Terjadwal, Filter Kelas, Buka Kunci & Reset Login ---
    document.querySelectorAll('.btn-pick-monitoring-jadwal').forEach(btn => {
      btn.addEventListener('click', () => {
        const jId = btn.getAttribute('data-pick-monitoring-jadwal');
        state.filterMonitoringJadwal = (state.filterMonitoringJadwal === jId) ? '' : jId;
        state.filterMonitoringKelas = '';
        render();
      });
    });

    document.getElementById('btn-clear-monitoring-jadwal')?.addEventListener('click', () => {
      state.filterMonitoringJadwal = '';
      state.filterMonitoringKelas = '';
      render();
    });

    document.getElementById('input-search-monitoring-mapel')?.addEventListener('input', (e) => {
      state.filterMonitoringSearch = e.target.value;
      render();
      const inp = document.getElementById('input-search-monitoring-mapel');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    });

    document.getElementById('filter-monitoring-kelas')?.addEventListener('change', (e) => {
      state.filterMonitoringKelas = e.target.value;
      render();
    });

    document.getElementById('btn-refresh-monitoring')?.addEventListener('click', async () => {
      await loadAllData();
      showToast('Data monitoring diperbarui');
    });

    document.querySelectorAll('.btn-unlock-sesi').forEach(btn => {
      btn.addEventListener('click', () => {
        const sesiId = btn.getAttribute('data-unlock-sesi');
        unlockStudentSession(sesiId);
      });
    });

    document.querySelectorAll('.btn-reset-login').forEach(btn => {
      btn.addEventListener('click', async () => {
        const uid = btn.getAttribute('data-reset-login');
        if (!uid) return;
        await dbUpdate('users_cbt', uid, { is_logged_in: false });
        showToast('Kunci login perangkat peserta berhasil direset!');
        render();
      });
    });

    // --- Cetak Dokumen & Edit Berita Acara Events ---
    document.getElementById('select-doc-type')?.addEventListener('change', (e) => {
      state.docType = e.target.value;
      state.editingBeritaAcara = false;
      render();
    });

    document.getElementById('select-doc-jadwal')?.addEventListener('change', (e) => {
      state.docJadwalId = e.target.value;
      const cfg = getSchoolConfig();
      const jadwal = state.db.jadwal_ujian.find(j => j.id === state.docJadwalId);
      const mapel = state.db.mata_pelajaran.find(m => m.id === jadwal?.mapel_id);
      const siswaAll = state.db.users_cbt.filter(u => u.role === 'siswa');
      const filteredSiswa = state.docKelas === 'SEMUA'
        ? siswaAll
        : siswaAll.filter(s => (s.kelas || '').toLowerCase() === (state.docKelas || '').toLowerCase());
      state.beritaAcaraForm = getDefaultBeritaAcaraData(cfg, jadwal, mapel, filteredSiswa.length);
      render();
    });

    document.getElementById('select-doc-kelas')?.addEventListener('change', (e) => {
      state.docKelas = e.target.value;
      if (state.docType === 'berita_acara') {
        const cfg = getSchoolConfig();
        const jadwal = state.db.jadwal_ujian.find(j => j.id === state.docJadwalId) || state.db.jadwal_ujian[0];
        const mapel = state.db.mata_pelajaran.find(m => m.id === jadwal?.mapel_id);
        const siswaAll = state.db.users_cbt.filter(u => u.role === 'siswa');
        const filteredSiswa = state.docKelas === 'SEMUA'
          ? siswaAll
          : siswaAll.filter(s => (s.kelas || '').toLowerCase() === (state.docKelas || '').toLowerCase());
        state.beritaAcaraForm = getDefaultBeritaAcaraData(cfg, jadwal, mapel, filteredSiswa.length);
      }
      render();
    });

    document.getElementById('btn-toggle-edit-ba')?.addEventListener('click', () => {
      state.editingBeritaAcara = !state.editingBeritaAcara;
      render();
    });

    document.getElementById('btn-reset-ba')?.addEventListener('click', () => {
      const cfg = getSchoolConfig();
      const jadwal = state.db.jadwal_ujian.find(j => j.id === state.docJadwalId) || state.db.jadwal_ujian[0];
      const mapel = state.db.mata_pelajaran.find(m => m.id === jadwal?.mapel_id);
      const siswaAll = state.db.users_cbt.filter(u => u.role === 'siswa');
      const filteredSiswa = state.docKelas === 'SEMUA'
        ? siswaAll
        : siswaAll.filter(s => (s.kelas || '').toLowerCase() === (state.docKelas || '').toLowerCase());
      state.beritaAcaraForm = getDefaultBeritaAcaraData(cfg, jadwal, mapel, filteredSiswa.length);
      showToast('Isi Berita Acara dikembalikan ke default.');
      render();
    });

    document.querySelectorAll('.input-ba-field').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const field = inp.getAttribute('data-ba-field');
        if (field && state.beritaAcaraForm) {
          state.beritaAcaraForm[field] = e.target.value;
          const printEl = document.getElementById('print-area');
          if (printEl && state.docType === 'berita_acara') {
            printEl.innerHTML = renderBeritaAcaraPrint(getSchoolConfig(), state.beritaAcaraForm);
          }
        }
      });

      });

      document.querySelectorAll('.btn-jump-soal').forEach(btn => {
        btn.addEventListener('click', () => {
          state.exam.currentIndex = Number(btn.getAttribute('data-jump'));
          state.exam.showDaftarSoalMobile = false;
          render();
        });
      });

      document.getElementById('btn-submit-exam-bottom')?.addEventListener('click', requestFinishExamConfirmation);
      document.getElementById('btn-submit-exam-sidebar')?.addEventListener('click', requestFinishExamConfirmation);
    }
  }

  setInterval(() => {
    const el = document.getElementById('header-clock');
    if (el) el.textContent = getWitaTimeString();
  }, 1000);

  // Sinkronisasi otomatis sesi live setiap 10 detik saat admin/guru memantau jadwal aktif
  setInterval(async () => {
    if (
      !IS_PREVIEW &&
      supabase &&
      state.currentUser &&
      (state.currentUser.role === 'admin' || state.currentUser.role === 'guru') &&
      state.activeMenu === 'monitoring' &&
      state.filterMonitoringJadwal &&
      !state.modal &&
      !state.confirmDialog
    ) {
      try {
        const { data } = await supabase
          .from('sesi_ujian_siswa')
          .select('*')
          .order('waktu_mulai', { ascending: false });
        if (data) {
          state.db.sesi_ujian_siswa = data;
          render();
        }
      } catch (e) {}
    }
  }, 10000);

  // Inisialisasi awal aplikasi & listener keamanan anti-curang
  async function initApp() {
    setupAntiCheatListeners();
    render();
    if (!IS_PREVIEW && supabase) {
      try {
        const { data } = await supabase.from('pengaturan_sekolah').select('*').limit(1);
        if (data && data.length > 0) {
          state.db.pengaturan_sekolah = data;
          render();
        }
      } catch (e) {}
    }
  }

  initApp();
</script>
</body>
</html>
